[project]
name = "chatbot-administrasi-api"
version = "0.1.0"
description = "Backend RAG chatbot administrasi mahasiswa"
requires-python = ">=3.11"

dependencies = [
    # --- LangChain: dipin ketat (PRD §12, risiko breaking change) ---------
    "langchain-core==1.6.2",
    "langchain==1.4.0",
    "langchain-text-splitters==1.1.2",
    "langchain-openai==1.6.2",
    "langchain-community==0.4.2",
    "langsmith==0.12.4",
    # Orkestrasi alur chat (app/rag/graph.py). Sudah ikut terpasang lewat
    # `langchain`; dicantumkan eksplisit karena kini dipakai langsung.
    "langgraph>=1.2,<1.3",

    # --- API -------------------------------------------------------------
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.52,<0.53",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "email-validator>=2.2,<3",
    "python-multipart>=0.0.32,<0.1",
    "sse-starlette>=2.1,<3",

    # --- Database --------------------------------------------------------
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.31,<0.32",
    "pgvector>=0.5,<0.6",
    "alembic>=1.19,<2",

    # --- Ingestion -------------------------------------------------------
    "pymupdf>=1.28,<2",

    # --- Penyimpanan objek (S3 / Cloudflare R2 / MinIO / B2) -------------
    "boto3>=1.40,<2",

    # --- Keamanan --------------------------------------------------------
    "bcrypt>=4.2,<6",
    "pyjwt>=2.13,<3",
    "slowapi>=0.1.10,<0.2",

    # --- Layanan luar via HTTP (JEV, reranker API) -----------------------
    "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "httpx>=0.28,<0.29",
    "pyyaml>=6.0,<7",
    "openapi-spec-validator>=0.7,<1",
    "moto[s3]>=5.1,<6",
    "ruff>=0.9",
    "mypy>=1.14",
]
# Model lokal: embedding multilingual-e5 dan reranker cross-encoder. Membawa
# torch (ratusan MB) -- pasang hanya bila EMBED_PROVIDER=local atau
# RERANK_PROVIDER=local.
local = [
    "sentence-transformers>=5,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "integration: butuh PostgreSQL hidup (set TEST_DATABASE_URL); dilewati bila tidak ada",
    "langchain: butuh paket LangChain terpasang",
]

[tool.ruff]
line-length = 95
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true

[tool.ruff.lint.flake8-bugbear]
# Idiom FastAPI: Depends() memang dievaluasi di default argumen.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]
