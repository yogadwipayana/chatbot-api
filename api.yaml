openapi: 3.1.0

# =============================================================================
# Kontrak API Chatbot Administrasi Mahasiswa
#
# Berkas ini adalah kontrak yang disepakati backend dan frontend, mencakup
# SELURUH permukaan API pada PRD v2.0 -- termasuk endpoint yang belum
# diimplementasikan, supaya pekerjaan frontend (client/ dan admin/) tidak perlu
# menunggu backend selesai.
#
# Setiap operasi diberi penanda `x-status`:
#   implemented : sudah ada di app/routers/, diuji di tests/api/
#   planned     : kontrak sudah disepakati, kode belum ditulis
#
# Setiap operasi admin juga diberi `x-min-role` (staf | admin | superadmin):
# level akun minimum. `tests/api/test_admin_roles.py` membangkitkan satu kasus
# untuk setiap level di bawah minimum dan memastikan server menjawab 403.
#
# `tests/api/test_openapi_contract.py` membandingkan berkas ini dengan spesifikasi
# yang dihasilkan FastAPI. Operasi `implemented` yang menyimpang akan menggagalkan
# test -- jadi kontrak ini tidak bisa diam-diam basi.
#
# Kalau ada perbedaan antara berkas ini dan kode untuk endpoint `implemented`,
# KODE yang benar. Perbarui berkas ini, jangan sebaliknya.
# =============================================================================

info:
  title: Chatbot Administrasi Mahasiswa
  version: 0.1.0
  description: |
    API chatbot RAG untuk pertanyaan administrasi akademik mahasiswa.

    ## Lima jenis balasan

    Endpoint chat selalu mengembalikan 200 dengan `kind` yang menentukan cara
    frontend menampilkannya. `answer`, `refusal`, dan `support` WAJIB terlihat
    berbeda satu sama lain:

    | `kind` | Arti | Tampilan |
    |---|---|---|
    | `answer` | Jawaban bersumber dokumen resmi | Bubble normal + kartu sitasi (FE-2) |
    | `refusal` | Dokumen resmi tidak menjawab: retrieval terlalu lemah sehingga LLM tidak dipanggil (FR-3), atau LLM menilai konteksnya tidak menjawab | Visual berbeda + kontak (FE-4) |
    | `support` | Pertanyaan bernuansa tekanan mental (FR-7) | Nada empatik + kontak konseling |
    | `smalltalk` | Sapaan atau basa-basi; retrieval dan LLM dilewati | Bubble biasa, tanpa sitasi dan tanpa tombol umpan balik |
    | `rejected` | Bukan pertanyaan administrasi: nonsense, upaya manipulasi, atau di luar topik kampus. Dihentikan saringan aturan, gerbang JEV, atau LLM penjawab | Bubble biasa, tanpa sitasi dan tanpa tombol umpan balik |

    Hanya `answer` yang membawa sitasi. Menampilkan kartu sitasi di layar
    penolakan memberi kesan keliru bahwa jawabannya bersumber; menampilkannya
    pada sapaan sama saja mengklaim "halo" ada di panduan akademik.

    `smalltalk` ada supaya mahasiswa yang mengetik "hai" tidak dibalas
    penolakan berisi alamat loket biro, dan supaya sapaan tidak masuk daftar
    pertanyaan tak terjawab (AD-4).

    `rejected` muncul entah gerbang JEV dinyalakan atau tidak: saringan aturan
    dan LLM penjawab (penanda `[DI_LUAR_TOPIK]`) menjadi cadangannya saat
    `JEV_ENABLED=false`. Sama seperti `smalltalk`, ia tidak masuk AD-4: pesan
    acak, upaya injeksi, atau pertanyaan di luar kampus bukan celah dokumen yang
    perlu ditambal admin.

    ## Sitasi dan verifikasi (FE-2)

    PRD §8 menyebut FE-2 sebagai komponen paling kritis: verifikasi harus
    semudah satu klik, kalau tidak mahasiswa akan percaya buta. Setiap objek
    `Citation` membawa `document_id` dan `page` yang cukup untuk membuka PDF
    tepat di halaman tersebut lewat `GET /api/documents/{document_id}/file`.

    ## Privasi

    Tidak ada login mahasiswa dan tidak ada identitas yang disimpan (PRD §11).
    `session_id` dibangkitkan di sisi klien dan disimpan di localStorage; ia
    hanya untuk merangkai percakapan dan membatasi laju, bukan untuk mengenali
    orang. Jangan pernah mengisinya dengan NIM atau email.

    ## Level akses dashboard admin

    Tiga level bertingkat; setiap level mencakup hak level di bawahnya.
    Level minimum tiap operasi tercatat sebagai `x-min-role`.

    | Level | Hak |
    |---|---|
    | `staf` (Staf/Dosen) | Kelola dokumen dan entri tanya jawab **unitnya sendiri**, uji coba jawaban, lihat pertanyaan tak terjawab |
    | `admin` | + kelola dokumen dan tanya jawab semua unit, tandai pertanyaan selesai, statistik |
    | `superadmin` | + kill switch layanan chat, kelola akun dashboard |

    Level dan unit dibaca dari database pada setiap permintaan, bukan dari isi
    token: perubahan level, pemindahan unit, dan penonaktifan akun berlaku saat
    itu juga. Token yang terbit sebelum kata sandi terakhir diganti ditolak.
  contact:
    name: Front Office INSTIKI
    url: https://instiki.ac.id/contact-us
  license:
    name: Internal kampus

servers:
  - url: http://localhost:8000
    description: Pengembangan lokal
  - url: https://chatbot.instiki.ac.id
    description: Produksi (di balik Caddy)

tags:
  - name: chat
    description: Endpoint mahasiswa. Tanpa login, dibatasi laju, tunduk pada kill switch.
  - name: units
    description: |
      Isi menu topik chatbot (unit layanan, pertanyaan per unit, program
      studi) dan isian unit di dashboard.
  - name: embed
    description: Pemeriksaan kunci sematan oleh portal, untuk asisten yang dipasang di situs lain.
  - name: documents
    description: Akses berkas PDF sumber, untuk verifikasi sitasi (FE-2).
  - name: health
    description: Health check dan status layanan.
  - name: admin-auth
    description: Autentikasi dashboard admin (AD-1).
  - name: admin-documents
    description: Kelola dokumen sumber (AD-2, AD-3).
  - name: admin-faq
    description: Entri tanya jawab, sumber jawaban yang diketik langsung tanpa PDF.
  - name: admin-quality
    description: Pertanyaan tak terjawab dan uji coba retrieval (AD-4, AD-6).
  - name: admin-ops
    description: Statistik dan kill switch (AD-5, FR-9).
  - name: admin-logs
    description: Log aplikasi dan performa per node pipeline chat, dari SQLite (`logs.md`).
  - name: admin-users
    description: Kelola akun dashboard dan level aksesnya (khusus superadmin).
  - name: admin-units
    description: Kelola daftar unit layanan (khusus superadmin).
  - name: admin-embed-keys
    description: Kelola kunci sematan situs lain yang memasang asisten (khusus superadmin).

paths:
  # ===========================================================================
  # MAHASISWA
  # ===========================================================================
  /api/chat:
    post:
      tags: [chat]
      summary: Ajukan pertanyaan, terima jawaban lengkap
      operationId: chat
      x-status: implemented
      description: |
        Balasan sekali kirim. Dipakai kotak uji coba admin (AD-6) dan test.
        Untuk antarmuka mahasiswa gunakan `/api/chat/stream` agar token muncul
        bertahap (FE-1).

        Alurnya (PRD §7): sanitasi input -> pemeriksaan sensitif (FR-7) ->
        penulisan ulang query (FR-4) -> retrieval hibrida (FR-2) -> ambang
        penolakan (FR-3) -> deteksi topik berisiko (FR-6) -> generasi (FR-5).

        LLM tidak dipanggil sama sekali bila `kind` bernilai `support`, begitu
        pula `refusal` yang diputuskan ambang FR-3. `refusal` juga dapat datang
        dari LLM yang menilai konteksnya tidak menjawab; bentuknya sama persis
        (teks penolakan + kontak, tanpa sitasi). Di `/api/chat/stream`, token
        yang sempat dialirkan sebelum penolakan itu diputuskan (biasanya tidak
        ada) digantikan isi event `message`, sama seperti jawaban biasa.
      parameters:
        - $ref: '#/components/parameters/SessionIdHeader'
        - $ref: '#/components/parameters/EmbedKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
            examples:
              first_question:
                summary: Pesan pertama, tanpa riwayat
                value:
                  question: Kapan pengisian KRS semester ganjil dibuka?
                  session_id: 5f2c9a1b-7e04-4d3a-9c88-1a2b3c4d5e6f
              follow_up_question:
                summary: Pertanyaan lanjutan, memicu penulisan ulang query (FR-4)
                value:
                  question: Kalau telat gimana?
                  session_id: 5f2c9a1b-7e04-4d3a-9c88-1a2b3c4d5e6f
                  history:
                    - role: user
                      content: Kapan pengisian KRS dibuka?
                    - role: assistant
                      content: Pengisian KRS dibuka 1-7 Agustus 2025.
              with_unit:
                summary: Dibatasi pada unit yang dipilih mahasiswa di menu
                value:
                  question: Bagaimana cara membayar UKT lewat virtual account?
                  session_id: 5f2c9a1b-7e04-4d3a-9c88-1a2b3c4d5e6f
                  unit: Keuangan
      responses:
        '200':
          description: |
            Selalu 200 selama pertanyaannya sah, termasuk saat sistem menolak
            menjawab. Penolakan adalah hasil yang sah, bukan kegagalan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
              examples:
                answer:
                  $ref: '#/components/examples/NormalAnswer'
                refusal:
                  $ref: '#/components/examples/Refusal'
                escalation:
                  $ref: '#/components/examples/EscalatedAnswer'
                support:
                  $ref: '#/components/examples/Support'
                smalltalk:
                  $ref: '#/components/examples/Smalltalk'
        '403':
          $ref: '#/components/responses/InvalidEmbedKey'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/KillSwitchEngaged'

  /api/chat/stream:
    post:
      tags: [chat]
      summary: Ajukan pertanyaan, terima jawaban sebagai Server-Sent Events
      operationId: chat_stream
      x-status: implemented
      description: |
        Sama dengan `/api/chat`, tetapi jawabannya dialirkan sebagai SSE (FE-1).

        Urutan event:

        | Event | Kapan | Data |
        |---|---|---|
        | `status` | Segera, sebelum retrieval | `{"stage": "mencari dokumen"}` |
        | `status` | Setelah retrieval, sebelum token pertama | `{"stage": "menyusun jawaban"}` |
        | `token` | Berkali-kali, selagi LLM menulis | `{"text": "<potongan jawaban>"}` |
        | `message` | Setelah pipeline selesai | Objek `ChatResponse` utuh |
        | `done` | Terakhir | `{}` |

        Event `status` yang mengisi indikator "mencari dokumen..." di FE-1.
        Tahap kedua menyusul begitu dokumen didapat, supaya indikatornya tidak
        tertinggal di kalimat yang sudah tidak benar selama LLM menyusun
        jawaban.

        `token` membawa potongan mentah jawaban, bukan jawaban yang bertambah
        panjang: klien merangkainya sendiri. Potongan hanya untuk ditampilkan
        selagi berjalan -- teks final yang sah adalah `text` pada `message`,
        yang juga satu-satunya sumber sitasi dan `message_id`. Jalur yang tidak
        memanggil LLM (penolakan FR-3, pertanyaan sensitif FR-7, sapaan) tidak
        mengirim `token` sama sekali dan langsung sampai ke `message`.

        Klien harus menangani putusnya koneksi di tengah jalan: bila `done`
        tidak pernah tiba, perlakukan jawaban sebagai tidak lengkap dan jangan
        tampilkan sitasinya.
      parameters:
        - $ref: '#/components/parameters/SessionIdHeader'
        - $ref: '#/components/parameters/EmbedKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Aliran SSE
          headers:
            Cache-Control:
              schema: { type: string, const: no-cache }
            X-Accel-Buffering:
              description: Mencegah reverse proxy menahan aliran sampai selesai.
              schema: { type: string, const: 'no' }
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: status
                data: {"stage": "mencari dokumen"}

                event: status
                data: {"stage": "menyusun jawaban"}

                event: token
                data: {"text": "Pengisian KRS dibuka"}

                event: token
                data: {"text": " 1-7 Agustus 2025"}

                event: message
                data: {"kind": "answer", "text": "Pengisian KRS dibuka 1-7 Agustus 2025 [Panduan Akademik 2025, hal. 12].", "citations": [{"title": "Panduan Akademik 2025", "page": 12, "document_id": "3f1a...", "file_path": "storage/documents/3f1a....pdf"}], "contacts": [], "escalated": false, "top_score": 0.82}

                event: done
                data: {}
        '403':
          $ref: '#/components/responses/InvalidEmbedKey'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/KillSwitchEngaged'

  /api/feedback:
    post:
      tags: [chat]
      summary: Kirim umpan balik atas satu jawaban
      operationId: submit_feedback
      x-status: implemented
      description: |
        FE-5: satu klik, tanpa modal. `comment` opsional dan hanya muncul bila
        mahasiswa memilih mengisinya.

        Mengirim ulang untuk `message_id` yang sama MENGGANTI umpan balik
        sebelumnya, supaya mahasiswa yang berubah pikiran dari 👍 ke 👎 tidak
        terhitung dua kali.

        Rasio umpan balik positif adalah metrik PRD §3 (target >= 75%).
        Perhatikan anti-metriknya: volume percakapan tinggi bisa berarti sistem
        berguna, bisa juga berarti jawabannya buruk sehingga mahasiswa bertanya
        berulang kali.
      parameters:
        - $ref: '#/components/parameters/SessionIdHeader'
        - $ref: '#/components/parameters/EmbedKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '204':
          description: Tercatat. Tidak ada isi balasan -- FE-5 tidak menampilkan konfirmasi.
        '403':
          $ref: '#/components/responses/InvalidEmbedKey'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/suggestions:
    get:
      tags: [chat]
      summary: Saran pertanyaan untuk layar awal
      operationId: list_suggestions
      x-status: planned
      description: |
        FE-6: 4-5 contoh pertanyaan, ditampilkan sebelum mahasiswa mengetik.

        Isinya WAJIB berasal dari hasil survei (PRD §15 butir 1), bukan karangan
        pengembang. Menampilkan pertanyaan yang tidak pernah benar-benar
        ditanyakan orang akan mengarahkan mahasiswa ke jalur yang salah sejak
        layar pertama.
      responses:
        '200':
          description: Daftar saran
          content:
            application/json:
              schema:
                type: array
                maxItems: 5
                items:
                  $ref: '#/components/schemas/Suggestion'
              example:
                - text: Kapan pengisian KRS dibuka?
                - text: Bagaimana cara mengajukan cuti kuliah?
                - text: Apa saja syarat wisuda?
                - text: Bagaimana cara minta surat keterangan aktif kuliah?

  /api/units:
    get:
      tags: [units]
      summary: Daftar unit layanan
      operationId: list_units
      x-status: implemented
      description: |
        Isi menu pilihan unit di chatbot. `name` dikirim kembali apa adanya
        sebagai `unit` pada `POST /api/chat` dan `/api/chat/stream`.

        Hanya unit aktif, dalam urutan tampil yang diatur di tabel `units`.
        Dashboard admin memakai daftar yang sama: dokumen, entri tanya jawab,
        dan akun staf hanya dapat diberi salah satu unit ini.

        Tidak tunduk pada kill switch, supaya dashboard admin tetap berfungsi
        saat layanan chat dimatikan.
      responses:
        '200':
          description: Unit aktif
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UnitOut'
              example:
                - name: BAAK
                  description: null
                - name: FO
                  description: Front Office
                - name: Keuangan
                  description: null

  /api/faq/questions:
    get:
      tags: [units]
      summary: Pertanyaan siap klik untuk satu topik
      operationId: list_faq_questions
      x-status: implemented
      description: |
        Isi menu topik chatbot: setelah mahasiswa memilih unit, tampilkan
        pertanyaan ini sebagai tombol. Mengklik satu tombol mengirim teksnya
        sebagai `question` pada `/api/chat/stream`, bersama `unit` yang sama.

        Asalnya entri tanya jawab yang diketik admin, bukan saran karangan, dan
        hanya entri yang sedang berlaku (aktif dan belum lewat `valid_until`) --
        persis yang terambil retrieval. Setiap pertanyaan di sini karena itu
        pasti punya jawaban. Topik yang belum punya entri mengembalikan daftar
        kosong.

        Terbaru lebih dulu. Tidak tunduk pada kill switch, sama seperti
        `GET /api/units`.
      parameters:
        - name: unit
          in: query
          required: false
          description: |
            `name` dari `GET /api/units`, tanpa peduli huruf besar. Kosong =
            semua unit. Nama yang tidak terdaftar dijawab 422.
          schema: { type: [string, 'null'], maxLength: 200 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 20, default: 6 }
      responses:
        '200':
          description: Pertanyaan, terbaru lebih dulu
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FaqQuestion'
              example:
                - question: Bagaimana cara membayar UKT lewat virtual account?
                - question: Kapan batas akhir pembayaran UKT semester ganjil?
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/programs:
    get:
      tags: [units]
      summary: Daftar program studi
      operationId: list_programs
      x-status: implemented
      description: |
        Untuk memeriksa dan menampilkan NIM di widget sebelum dikirim. NIM
        INSTIKI berformat `aaabbddccc`: digit 4-7 (`bbdd`, fakultas lalu
        prodi) dicocokkan dengan `code` di sini. NIM dengan kode di luar daftar
        ini ditolak 422 oleh `/api/chat`.

        Tidak tunduk pada kill switch, sama seperti `GET /api/units`.
      responses:
        '200':
          description: Program studi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProgramOut'
              example:
                - code: '1010'
                  name: Informatika
                  level: S1
                  faculty: Fakultas Teknik Informatika
                - code: '0301'
                  name: Magister Informatika
                  level: S2
                  faculty: Pascasarjana

  /api/embed/keys/{key}:
    get:
      tags: [embed]
      summary: Situs yang boleh memuat panel untuk satu kunci sematan
      operationId: get_embed_key
      x-status: implemented
      description: |
        Dipanggil SERVER portal (`client/src/proxy.ts`) setiap kali halaman
        `/embed?key=...` dimuat, bukan oleh peramban. `allowed_origins` menjadi
        header `Content-Security-Policy: frame-ancestors` halaman itu, sehingga
        peramban sendiri yang menolak menampilkan panel di situs lain. Daftar
        kosong = situs mana pun.

        Perubahan dari dashboard berlaku saat panel dibuka berikutnya, tanpa
        build ulang portal.

        Publik: kunci tertulis di kode sumber situs penyemat, dan daftar situsnya
        dapat dilihat siapa pun yang membuka situs-situs itu. Tidak tunduk pada
        kill switch -- panelnya tetap dimuat dan menyampaikan pesan penutupan
        saat mahasiswa bertanya.
      parameters:
        - name: key
          in: path
          required: true
          description: '`emb_` + 24 karakter alfanumerik, dari atribut `data-key` di `embed.js`.'
          schema: { type: string }
      responses:
        '200':
          description: Kunci aktif
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmbedKeyInfo' }
              example:
                allowed_origins: [https://pmb.instiki.ac.id, https://www.instiki.ac.id]
        '404':
          description: Kunci tidak dikenal, salah bentuk, atau sudah dinonaktifkan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/documents/{document_id}/file:
    get:
      tags: [documents]
      summary: Unduh atau tampilkan PDF sumber
      operationId: get_document_file
      x-status: implemented
      description: |
        Tujuan klik pada kartu sitasi (FE-2). Nomor halaman TIDAK dikirim ke
        server -- klien membukanya lewat fragment PDF viewer
        (`.../file#page=12`) atau meneruskannya ke react-pdf.

        Hanya dokumen `is_active = true` yang dilayani. Dokumen yang sudah
        dinonaktifkan mengembalikan 404, supaya tautan lama pada percakapan
        lampau tidak diam-diam menyajikan informasi kedaluwarsa.

        **Balasannya bergantung pada `STORAGE_BACKEND`, jadi klien harus siap
        menerima keduanya:**

        | Backend | Balasan |
        |---|---|
        | `s3` (S3 / R2) | `307` ke presigned URL atau URL publik bucket |
        | `local` | `200` dengan isi PDF langsung |

        Pengalihan dipilih untuk S3 supaya PDF mengalir dari object storage ke
        peramban tanpa melewati proses API. Panduan akademik bisa puluhan
        megabita; menyalurkannya lewat API hanya menghabiskan memori dan
        koneksi tanpa manfaat apa pun.

        Setel `fetch(..., { redirect: 'follow' })` atau cukup pasang URL ini
        sebagai `src` — peramban mengikuti pengalihan dengan sendirinya. Jangan
        cache URL hasil pengalihan: presigned URL kedaluwarsa (default 15
        menit) dan harus diminta ulang lewat endpoint ini.
      parameters:
        - name: document_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Berkas PDF (hanya saat `STORAGE_BACKEND=local`)
          headers:
            Content-Disposition:
              description: '`inline` agar terbuka di viewer, bukan terunduh.'
              schema: { type: string }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '307':
          description: |
            Pengalihan ke object storage (saat `STORAGE_BACKEND=s3`).
          headers:
            Location:
              description: Presigned URL berumur pendek, atau URL publik bucket.
              schema: { type: string, format: uri }
        '404':
          $ref: '#/components/responses/NotFound'

  # ===========================================================================
  # SISTEM
  # ===========================================================================
  /health:
    get:
      tags: [health]
      summary: Health check
      operationId: health
      x-status: implemented
      description: |
        Dipakai Uptime Kuma (PRD §10).

        Tetap 200 saat kill switch aktif. Kill switch adalah keputusan operator,
        bukan kegagalan sistem; melaporkannya sebagai unhealthy akan membuat
        monitoring membanjiri alert justru ketika insiden sedang ditangani.
        Pantau `chat_enabled` bila ingin tahu layanan chat hidup atau tidak.
      responses:
        '200':
          description: Proses hidup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  # ===========================================================================
  # ADMIN
  # ===========================================================================
  /api/admin/login:
    post:
      tags: [admin-auth]
      summary: Login admin
      operationId: admin_login
      x-status: implemented
      description: |
        AD-1. Mengembalikan JWT berumur `ADMIN_TOKEN_TTL_MINUTES` (default 8 jam).

        Balasan gagal sengaja tidak membedakan "email tidak terdaftar" dari
        "kata sandi salah", supaya tidak bisa dipakai memetakan siapa saja yang
        punya akun admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '403':
          description: |
            Kata sandi benar, tetapi akun sudah dinonaktifkan superadmin. Hanya
            diberitahukan setelah kata sandi terbukti benar, jadi status akun tidak
            bocor ke orang yang sekadar menebak email.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Email atau kata sandi salah
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { detail: Email atau kata sandi salah }
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/admin/documents:
    get:
      tags: [admin-documents]
      summary: Daftar dokumen
      operationId: list_documents
      x-status: implemented
      x-min-role: staf
      security: [{ bearerAuth: [] }]
      description: |
        AD-2. Setiap baris membawa `stale` untuk badge peringatan: dokumen yang
        lebih dari 6 bulan tidak diperbarui, atau sudah lewat `valid_until`.

        PRD §12 menyebut "dokumen tidak diupdate" sebagai risiko dengan dampak
        sistem menyebarkan info kedaluwarsa secara aktif. Badge ini mitigasinya,
        jadi jangan sembunyikan di balik filter.

        Staf/dosen hanya melihat dokumen unitnya; `total` dan `stale_count` pun
        dihitung atas unit itu. Membuka, mengubah, menghapus, atau mengunggah
        dokumen unit lain dijawab 403. Nama unit dibandingkan tanpa peduli huruf
        besar dan spasi berlebih.
      parameters:
        - name: include_inactive
          in: query
          schema: { type: boolean, default: false }
        - name: only_stale
          in: query
          description: Saring hanya dokumen yang perlu ditinjau.
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Daftar dokumen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [admin-documents]
      summary: Unggah dokumen baru
      operationId: upload_document
      x-status: implemented
      x-min-role: staf
      security: [{ bearerAuth: [] }]
      description: |
        AD-3. Drag & drop + form metadata. Pemrosesan berjalan sinkron: unggah,
        ekstraksi, chunking, embedding, simpan -- semuanya dalam satu transaksi.
        Dokumen yang gagal di tengah jalan tidak meninggalkan chunk yatim.

        PDF tanpa lapisan teks (hasil scan, atau dicetak dengan Print to PDF yang
        mengubah huruf menjadi garis gambar) ditolak dengan 422 (FR-1). Ini bukan
        kerewelan: chunk kosong tetap masuk indeks dan tidak pernah terambil,
        sehingga dokumen tampak terpasang padahal tidak berfungsi.

        Bahasa pesan galat ke admin harus non-teknis (PRD §9).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentUpload'
            encoding:
              file:
                contentType: application/pdf
      responses:
        '201':
          description: Dokumen terpasang dan terindeks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          description: |
            Layanan luar gagal: penyimpanan dokumen atau API AI. `detail` berisi
            kalimat siap tampil yang menyarankan mencoba lagi; rinciannya hanya
            ada di log server.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: Berkas melebihi `MAX_UPLOAD_MB`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: |
            Berkas ditolak. `detail` sudah berupa kalimat siap tampil untuk admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                pdf_scan:
                  summary: PDF tanpa lapisan teks -- hasil scan atau Print to PDF (FR-1)
                  value:
                    detail: >-
                      'Panduan Akademik 2025.pdf' tidak memiliki lapisan teks (hasil
                      scan atau dicetak dengan Print to PDF); 85% halamannya kosong.
                      Simpan ulang dari aplikasi aslinya dengan Save as PDF, atau
                      jalankan OCR bila dokumennya hasil scan.
                empty:
                  summary: Tidak menghasilkan satu chunk pun
                  value:
                    detail: "'Lampiran.pdf' tidak menghasilkan satu chunk pun"

  /api/admin/documents/{document_id}:
    parameters:
      - name: document_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [admin-documents]
      summary: Detail satu dokumen
      operationId: get_document
      x-status: implemented
      x-min-role: staf
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Detail dokumen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    patch:
      tags: [admin-documents]
      summary: Perbarui metadata atau status aktif
      operationId: update_document
      x-status: implemented
      x-min-role: staf
      security: [{ bearerAuth: [] }]
      description: |
        Mengubah `valid_until` atau `is_active` langsung mempengaruhi retrieval
        pada permintaan berikutnya -- filter dokumen aktif dievaluasi di dalam
        WHERE setiap query (FR-2), bukan di-cache.

        Menonaktifkan dokumen TIDAK menghapus chunk-nya, sehingga dapat
        dikembalikan bila ternyata keliru.

        `updated_at` diperbarui saat `title`, `unit`, `effective_year`, atau
        `valid_until` berubah -- itu dianggap peninjauan dan menghapus badge
        usia AD-2. Mengubah `is_active` saja tidak: menyalakan ulang dokumen
        lama tidak boleh menghapus peringatannya.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentUpdate' }
      responses:
        '200':
          description: Tersimpan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

    delete:
      tags: [admin-documents]
      summary: Hapus dokumen beserta seluruh chunk-nya
      operationId: delete_document
      x-status: implemented
      x-min-role: staf
      security: [{ bearerAuth: [] }]
      description: |
        Permanen dan tidak dapat dibatalkan. Frontend WAJIB meminta konfirmasi
        (PRD §9: semua aksi destruktif butuh konfirmasi).

        Untuk sekadar mengeluarkan dokumen dari indeks, pakai
        `PATCH { "is_active": false }` -- itu dapat dikembalikan.
      responses:
        '204':
          description: Terhapus
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/documents/{document_id}/chunks:
    get:
      tags: [admin-documents]
      summary: Pratinjau hasil chunking
      operationId: list_document_chunks
      x-status: implemented
      x-min-role: staf
      security: [{ bearerAuth: [] }]
      description: |
        AD-3 menyebut "preview hasil chunk". Gunanya konkret: admin dapat
        melihat apakah tabel atau daftar bernomor terpotong di tengah, yang
        merupakan penyebab paling umum jawaban benar tetapi tidak lengkap.
      parameters:
        - name: document_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Daftar chunk terurut
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Chunk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/faq:
    get:
      tags: [admin-faq]
      summary: Daftar entri tanya jawab
      operationId: list_faq
      x-status: implemented
      x-min-role: staf
      security: [{ bearerAuth: [] }]
      description: |
        Entri tanya jawab adalah satu pasang pertanyaan dan jawaban yang diketik
        admin langsung di dashboard, tanpa berkas PDF sama sekali.

        Chatbot memperlakukannya persis seperti dokumen: ikut terambil retrieval
        hibrida, ikut berhenti dipakai saat `valid_until` lewat (FR-2), dan ikut
        menjadi kartu sitasi -- dengan `type: tanya_jawab`, sehingga frontend
        tahu tidak ada berkas yang bisa dibuka.

        Inilah jalan tercepat menutup pertanyaan tak terjawab (AD-4): tidak
        semua jawaban perlu menunggu dokumen resmi terbit lebih dulu.

        Staf/dosen hanya melihat entri unitnya, sama seperti dokumen, dan
        `total` pun dihitung atas unit itu.
      parameters:
        - name: include_inactive
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Daftar entri tanya jawab
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaqPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

    post:
      tags: [admin-faq]
      summary: Tambah entri tanya jawab
      operationId: create_faq
      x-status: implemented
      x-min-role: staf
      security: [{ bearerAuth: [] }]
      description: |
        Sinkron seperti unggah dokumen: entri disimpan, dipecah menjadi chunk,
        dan di-embed dalam satu transaksi. Begitu balasan 201 diterima, chatbot
        sudah dapat memakainya pada pertanyaan berikutnya.

        Tulis pertanyaannya seperti mahasiswa akan menanyakannya -- kalimat itu
        ikut diindeks dan ikut tampil sebagai judul sumber pada kartu sitasi.

        Jawaban panjang dipecah menjadi beberapa chunk, dan setiap potongannya
        tetap membawa pertanyaannya.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FaqEntryCreate' }
      responses:
        '201':
          description: Entri tersimpan dan terindeks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaqEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '502':
          description: |
            Layanan AI untuk menghitung embedding gagal. `detail` berisi kalimat
            siap tampil yang menyarankan mencoba lagi; entri tidak tersimpan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/admin/faq/{entry_id}:
    parameters:
      - name: entry_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [admin-faq]
      summary: Perbarui entri tanya jawab
      operationId: update_faq
      x-status: implemented
      x-min-role: staf
      security: [{ bearerAuth: [] }]
      description: |
        Mengubah `question` atau `answer` membuang chunk lama dan menghitung
        ulang embedding-nya dalam transaksi yang sama. Indeks yang masih memuat
        kalimat versi lama akan menjawab mahasiswa dengan aturan yang sudah
        dicabut -- persis risiko yang diangkat PRD §12.

        `updated_at` diperbarui saat isi berubah (`question`, `answer`,
        `unit`, `valid_until`), tetapi tidak saat hanya `is_active` yang
        berubah -- sama seperti dokumen.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FaqEntryUpdate' }
      responses:
        '200':
          description: Tersimpan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaqEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '502':
          description: Layanan AI gagal saat mengindeks ulang; entri tidak berubah.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

    delete:
      tags: [admin-faq]
      summary: Hapus entri tanya jawab
      operationId: delete_faq
      x-status: implemented
      x-min-role: staf
      security: [{ bearerAuth: [] }]
      description: |
        Permanen dan tidak dapat dibatalkan; frontend WAJIB meminta konfirmasi
        (PRD §9). Untuk sekadar menghentikan pemakaiannya, pakai
        `PATCH { "is_active": false }`.
      responses:
        '204':
          description: Terhapus
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/unanswered:
    get:
      tags: [admin-quality]
      summary: Pertanyaan tak terjawab, dikelompokkan
      operationId: list_unanswered
      x-status: implemented
      x-min-role: staf
      security: [{ bearerAuth: [] }]
      description: |
        AD-4. PRD menyebut halaman ini "menentukan sistem membaik atau stagnan"
        dan meminta ia ditempatkan menonjol di navigasi.

        Pertanyaan yang mirip dikelompokkan beserta frekuensinya, sehingga admin
        melihat "12 mahasiswa menanyakan ini" alih-alih 12 baris terpisah.

        Kemiripan diukur dari kata yang sama setelah kata tanya dan sapaan
        dibuang (bukan embedding), jadi dapat dijelaskan dan tidak memanggil API
        berbayar. Pertanyaan yang sudah dan belum ditindaklanjuti tidak pernah
        berada di kelompok yang sama. `limit` dan `offset` berlaku atas
        kelompok, bukan atas baris.
      parameters:
        - name: resolved
          in: query
          description: Kosongkan untuk menampilkan keduanya.
          schema: { type: boolean }
        - name: since
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Kelompok pertanyaan
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UnansweredGroup' }
              example:
                - ids:
                    - 0b6f2c1e-3a4d-4e5f-9a8b-7c6d5e4f3a2b
                    - 1c7a3d2f-4b5e-4f60-8b9c-8d7e6f5a4b3c
                  sample_question: Bagaimana cara mengurus surat keterangan lulus?
                  count: 12
                  avg_top_score: 0.21
                  last_asked_at: '2026-09-09T14:22:11Z'
                  resolved: false
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/unanswered/{unanswered_id}:
    patch:
      tags: [admin-quality]
      summary: Tandai pertanyaan sudah ditindaklanjuti
      operationId: resolve_unanswered
      x-status: implemented
      x-min-role: admin
      security: [{ bearerAuth: [] }]
      description: |
        Ditandai `resolved` setelah dokumen yang menjawabnya diunggah. Ini
        bukan sekadar penanda kerapian -- selisih antara pertanyaan masuk dan
        pertanyaan terselesaikan adalah ukuran apakah sistem benar-benar
        membaik.

        Satu PATCH mengubah satu baris. Untuk menandai satu kelompok AD-4,
        kirim PATCH untuk setiap id di `UnansweredGroup.ids`.
      parameters:
        - name: unanswered_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnansweredUpdate' }
      responses:
        '204': { description: Tersimpan }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/feedback:
    get:
      tags: [admin-quality]
      summary: Umpan balik mahasiswa atas jawaban
      operationId: list_feedback
      x-status: implemented
      x-min-role: admin
      security: [{ bearerAuth: [] }]
      description: |
        Penilaian 👍/👎 yang dikirim mahasiswa lewat `POST /api/feedback` (FE-5),
        terbaru lebih dulu, beserta pertanyaan dan jawaban yang dinilai.

        Statistik AD-5 hanya memuat rasio kepuasan: ia memberi tahu ada yang
        salah, bukan apanya. Daftar ini melengkapinya -- jempol ke bawah dapat
        ditelusuri ke pertanyaan yang memicunya, lalu diuji ulang lewat
        `POST /api/admin/test-query`.

        `comment` jarang terisi: FE-5 satu klik tanpa modal, jadi sebagian besar
        baris hanya berupa jempol. `question` diambil dari pesan mahasiswa
        terakhir sebelum jawaban itu di percakapan yang sama; untuk pertanyaan
        sensitif (FR-7) yang tersimpan adalah penanda tetap, bukan kalimat
        aslinya.

        Isi percakapan, jadi levelnya sama dengan statistik: minimal admin.
      parameters:
        - name: helpful
          in: query
          description: Kosongkan untuk menampilkan keduanya.
          schema: { type: boolean }
        - name: since
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Umpan balik
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedbackPage' }
              example:
                items:
                  - id: 7d1e4b2a-9c3f-4e58-b0a7-1f2e3d4c5b6a
                    message_id: 9c3e1a44-6b2d-4f51-8a70-2d9b5c1e7f03
                    helpful: false
                    comment: Jawabannya tidak menyebut biaya cetaknya
                    created_at: '2026-09-09T14:25:03Z'
                    question: Berapa biaya legalisir ijazah?
                    answer: Legalisir ijazah diurus di Biro Administrasi Akademik [Panduan Akademik 2025, hal. 12].
                    kind: answer
                    top_score: 0.62
                total: 18
                positive_count: 124
                negative_count: 18
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/test-query:
    post:
      tags: [admin-quality]
      summary: Uji coba retrieval, tampilkan chunk dan skornya
      operationId: admin_test_query
      x-status: implemented
      x-min-role: staf
      security: [{ bearerAuth: [] }]
      description: |
        AD-6. Berbeda dari `/api/chat`: balasan ikut membawa chunk yang terambil
        beserta skor mentah tiap sumber (vector dan fulltext) dan skor RRF.

        Ini alat diagnosa utama saat ada laporan "jawabannya salah". Skor mentah
        yang ditampilkan, bukan skor RRF, karena skor RRF hanya mencerminkan
        peringkat -- chunk terbaik dari sekumpulan chunk tak relevan tetap
        mendapat skor RRF tertinggi.

        Tidak tunduk pada kill switch (admin perlu mendiagnosis justru saat
        layanan dimatikan) dan TIDAK dicatat ke log percakapan, supaya uji coba
        tidak mencemari AD-4 maupun AD-5. LLM tetap dipanggil bila lolos ambang.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestQueryRequest' }
      responses:
        '200':
          description: Hasil beserta rincian retrieval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestQueryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '502':
          description: |
            Layanan AI gagal (LLM, gateway, atau embedding pertanyaan). `detail`
            berisi kalimat siap tampil yang menyarankan mencoba lagi; rinciannya
            hanya ada di log server.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/admin/stats:
    get:
      tags: [admin-ops]
      summary: Statistik penggunaan dan biaya
      operationId: admin_stats
      x-status: implemented
      x-min-role: admin
      security: [{ bearerAuth: [] }]
      description: |
        AD-5. Termasuk `running_cost_usd` -- PRD §12 menandai biaya API
        membengkak sebagai risiko dengan dampak layanan mati mendadak.

        `total_conversations` disajikan sebagai konteks, bukan sebagai ukuran
        keberhasilan. PRD §3 menetapkannya sebagai anti-metrik.

        Tanpa parameter: 30 hari terakhir sampai hari ini. Hari dihitung menurut
        `TIMEZONE` server, bukan UTC. Rentang paling panjang 366 hari.
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date }
        - name: until
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Statistik
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stats' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Rentang tanggal tidak sah (terbalik atau terlalu panjang)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/admin/costs:
    get:
      tags: [admin-ops]
      summary: Rincian biaya dan token
      operationId: admin_costs
      x-status: implemented
      x-min-role: admin
      security: [{ bearerAuth: [] }]
      description: Menghitung penggunaan token dan estimasi biaya dari kolom `messages.meta`.
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date }
        - name: until
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Rincian biaya
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Costs' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Rentang tanggal tidak sah
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/admin/logs/summary:
    get:
      tags: [admin-logs]
      summary: Ringkasan performa pipeline chat
      operationId: log_summary
      x-status: implemented
      x-min-role: admin
      security: [{ bearerAuth: [] }]
      description: |
        Dibaca dari SQLite log (`LOG_DB_PATH`), bukan Postgres. KPI giliran, p50/p95
        durasi per node LangGraph, distribusi titik keluar, dan tren per jam (UTC).
        Untuk role admin, log `app.audit` tidak ikut dihitung di `error_log_count`.
      parameters:
        - $ref: '#/components/parameters/LogRange'
      responses:
        '200':
          description: Ringkasan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Parameter tidak sah
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/admin/logs/turns:
    get:
      tags: [admin-logs]
      summary: Daftar giliran chat
      operationId: list_turns
      x-status: implemented
      x-min-role: admin
      security: [{ bearerAuth: [] }]
      description: Terbaru lebih dulu. Tanpa teks pertanyaan/jawaban; buka lewat `message_id`.
      parameters:
        - $ref: '#/components/parameters/LogRange'
        - { name: outcome, in: query, schema: { type: string } }
        - name: status
          in: query
          schema: { type: string, enum: [ok, error, dibatalkan] }
        - { name: unit, in: query, schema: { type: string } }
        - { name: last_node, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Satu halaman giliran
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TurnPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Parameter tidak sah
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/admin/logs/turns/{turn_id}:
    get:
      tags: [admin-logs]
      summary: Detail satu giliran chat
      operationId: get_turn
      x-status: implemented
      x-min-role: admin
      security: [{ bearerAuth: [] }]
      description: Node yang berjalan beserta durasi dan detailnya, plus log selama giliran itu.
      parameters:
        - { name: turn_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Detail giliran
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TurnDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/logs/app:
    get:
      tags: [admin-logs]
      summary: Log aplikasi
      operationId: list_app_logs
      x-status: implemented
      x-min-role: admin
      security: [{ bearerAuth: [] }]
      description: |
        Log Python logger `app.*`. Log `app.audit` hanya untuk superadmin; role admin
        yang memfilter `logger=app.audit` mendapat daftar kosong, bukan 403.
      parameters:
        - $ref: '#/components/parameters/LogRange'
        - name: level
          in: query
          description: Level minimum.
          schema: { type: string, enum: [DEBUG, INFO, WARNING, ERROR, CRITICAL], default: INFO }
        - name: logger
          in: query
          description: Nama logger; turunannya ikut, mis. `app.rag`.
          schema: { type: string }
        - name: q
          in: query
          description: Cari di isi pesan.
          schema: { type: string, maxLength: 200 }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Satu halaman log
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppLogPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Parameter tidak sah
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/admin/kill-switch:
    get:
      tags: [admin-ops]
      summary: Status kill switch
      operationId: get_kill_switch
      x-status: implemented
      x-min-role: staf
      description: Semua level boleh membaca, supaya banner "layanan dimatikan" tampil untuk semua admin.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KillSwitchState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

    post:
      tags: [admin-ops]
      summary: Nyalakan atau matikan kill switch
      operationId: set_kill_switch
      x-status: implemented
      x-min-role: superadmin
      security: [{ bearerAuth: [] }]
      description: |
        FR-9. Mematikan layanan chat dengan cepat saat insiden, tanpa menunggu
        deploy ulang.

        `reason` wajib diisi saat menyalakan: insiden tanpa catatan alasan tidak
        bisa diaudit setelahnya. Dashboard admin tetap hidup saat kill switch
        aktif -- justru saat itulah admin perlu masuk untuk melihat apa yang
        terjadi.

        PRD §14 mensyaratkan kill switch DIUJI sebelum rilis, bukan sekadar ada.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KillSwitchRequest' }
      responses:
        '200':
          description: Status baru
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KillSwitchState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/admin/config:
    get:
      tags: [admin-ops]
      summary: Setelan retrieval dan chunking yang berlaku
      operationId: get_runtime_config
      x-status: implemented
      x-min-role: superadmin
      security: [{ bearerAuth: [] }]
      description: |
        Parameter FR-1/FR-2/FR-3 yang dipakai layanan saat ini (`values`), beserta
        nilai `.env` server sebagai pembandingnya (`env_values`) dan daftar
        parameter yang sedang ditimpa dari dashboard (`overridden`).

        Nama model dan endpoint ikut dikirim sebagai keterangan saja -- mengganti
        model embedding menuntut re-index seluruh dokumen, jadi ia tetap hanya
        lewat `.env`. Kunci API tidak pernah dikirim; hanya `api_key_set`.
      responses:
        '200':
          description: Konfigurasi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

    patch:
      tags: [admin-ops]
      summary: Ubah setelan retrieval dan chunking
      operationId: update_runtime_config
      x-status: implemented
      x-min-role: superadmin
      security: [{ bearerAuth: [] }]
      description: |
        Hanya field yang dikirim yang diubah, dan perubahannya berlaku pada
        permintaan berikutnya tanpa restart. Nilai yang sama persis dengan
        `.env` -- atau `null` -- menghapus penimpaannya; itulah cara
        "kembalikan ke nilai server" untuk satu parameter.

        Yang divalidasi adalah keadaan setelah perubahan, bukan hanya isi
        permintaan: `chunk_overlap` yang sah sendirian tetap ditolak bila
        melanggar `chunk_size` yang sudah tersimpan.

        `chunk_size` dan `chunk_overlap` hanya mengenai dokumen yang diproses
        setelahnya; dokumen lama baru ikut berubah bila diunggah ulang.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuntimeConfigUpdate' }
      responses:
        '200':
          description: Konfigurasi setelah perubahan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Nilai di luar batas, atau kombinasinya tidak sah
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

    delete:
      tags: [admin-ops]
      summary: Kembalikan seluruh setelan ke nilai .env
      operationId: reset_runtime_config
      x-status: implemented
      x-min-role: superadmin
      security: [{ bearerAuth: [] }]
      description: |
        Menghapus seluruh penimpaan sekaligus. Jalan keluar saat penyetelan
        membuat jawaban makin buruk dan tidak jelas lagi nilai mana yang diubah.
        Mengembalikan konfigurasi sesudahnya, bukan 204, supaya dashboard tidak
        perlu memuat ulang.
      responses:
        '200':
          description: Konfigurasi setelah dikembalikan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/me:
    get:
      tags: [admin-auth]
      summary: Akun yang sedang masuk
      operationId: get_me
      x-status: implemented
      x-min-role: staf
      security: [{ bearerAuth: [] }]
      description: |
        Level dan unit menurut database SAAT INI, bukan isi token. Dashboard
        memakainya untuk memilih menu yang tampil; penegakan aksesnya tetap di
        server.
      responses:
        '200':
          description: Akun
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/admin/me/password:
    post:
      tags: [admin-auth]
      summary: Ganti kata sandi sendiri
      operationId: change_my_password
      x-status: implemented
      x-min-role: staf
      security: [{ bearerAuth: [] }]
      description: |
        Dipakai terutama setelah menerima kata sandi sementara dari superadmin.
        Semua sesi lain akun ini langsung berakhir. Balasan membawa token baru
        untuk sesi yang dipakai mengganti, jadi tidak perlu masuk ulang.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChange' }
      responses:
        '200':
          description: Tersimpan; token baru
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400':
          description: Kata sandi lama salah, atau kata sandi baru sama dengan yang lama
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/admin/users:
    get:
      tags: [admin-users]
      summary: Daftar akun dashboard
      operationId: list_users
      x-status: implemented
      x-min-role: superadmin
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Akun, superadmin lebih dulu
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

    post:
      tags: [admin-users]
      summary: Buat akun dashboard
      operationId: create_user
      x-status: implemented
      x-min-role: superadmin
      security: [{ bearerAuth: [] }]
      description: |
        Kata sandi dibangkitkan server dan dikembalikan SEKALI sebagai
        `temporary_password`. Superadmin tidak memilih kata sandi orang lain,
        sehingga tidak ada yang mengetahui kata sandi akhir selain pemiliknya
        setelah ia menggantinya.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserCreate' }
      responses:
        '201':
          description: Akun dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserCreated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Email sudah dipakai, atau level staf tanpa unit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/admin/users/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [admin-users]
      summary: Ubah nama, level, unit, atau status aktif
      operationId: update_user
      x-status: implemented
      x-min-role: superadmin
      security: [{ bearerAuth: [] }]
      description: |
        Berlaku pada permintaan berikutnya akun tersebut. Ditolak 409 bila:
        superadmin menurunkan level atau menonaktifkan dirinya sendiri,
        superadmin aktif terakhir disingkirkan, atau level staf tanpa unit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserUpdate' }
      responses:
        '200':
          description: Tersimpan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Melanggar aturan akun (lihat deskripsi)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

    delete:
      tags: [admin-users]
      summary: Hapus akun dashboard
      operationId: delete_user
      x-status: implemented
      x-min-role: superadmin
      security: [{ bearerAuth: [] }]
      description: |
        Permanen; frontend WAJIB meminta konfirmasi. Untuk menghentikan akses
        sementara, nonaktifkan saja. Dokumen unggahan akun ini tidak ikut
        terhapus.
      responses:
        '204':
          description: Terhapus
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Menghapus diri sendiri, atau superadmin aktif terakhir
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/admin/users/{user_id}/reset-password:
    post:
      tags: [admin-users]
      summary: Atur ulang kata sandi akun lain
      operationId: reset_user_password
      x-status: implemented
      x-min-role: superadmin
      security: [{ bearerAuth: [] }]
      description: |
        Membangkitkan kata sandi sementara baru (ditampilkan sekali) dan
        mengakhiri semua sesi akun itu. Untuk akun sendiri gunakan
        `POST /api/admin/me/password`.
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Kata sandi sementara
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemporaryPassword' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Mengatur ulang akun sendiri
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/admin/units:
    get:
      tags: [admin-units]
      summary: Daftar semua unit layanan
      operationId: list_admin_units
      x-status: implemented
      x-min-role: superadmin
      security: [{ bearerAuth: [] }]
      description: |
        Termasuk unit nonaktif, dalam urutan menu, beserta jumlah dokumen dan
        akun yang memakainya. Untuk isian unit gunakan `GET /api/units`, yang
        hanya memuat unit aktif.
      responses:
        '200':
          description: Semua unit
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminUnit' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

    post:
      tags: [admin-units]
      summary: Tambah unit layanan
      operationId: create_unit
      x-status: implemented
      x-min-role: superadmin
      security: [{ bearerAuth: [] }]
      description: |
        Unit baru langsung aktif: tampil di menu chatbot dan dapat dipilih untuk
        dokumen, entri tanya jawab, dan akun staf. `sort_order` kosong = paling akhir.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUnitCreate' }
      responses:
        '201':
          description: Unit dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUnit' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Nama sama dengan unit lain (huruf besar-kecil dan spasi tidak dibedakan)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/admin/units/{name}:
    patch:
      tags: [admin-units]
      summary: Ubah nama, deskripsi, urutan, atau status aktif unit
      operationId: update_unit
      x-status: implemented
      x-min-role: superadmin
      security: [{ bearerAuth: [] }]
      description: |
        Nama baru ikut tersimpan di setiap dokumen dan akun unit itu
        (`ON UPDATE CASCADE`). Unit tidak dapat dihapus; menonaktifkannya
        menyembunyikan unit dari menu chatbot dan dari pilihan isian baru,
        sementara dokumen dan akunnya tetap ada.
      parameters:
        - name: name
          in: path
          required: true
          description: Ejaan resmi, persis seperti di `GET /api/admin/units`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUnitUpdate' }
      responses:
        '200':
          description: Tersimpan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUnit' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Nama baru sama dengan unit lain
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/admin/embed-keys:
    get:
      tags: [admin-embed-keys]
      summary: Daftar kunci sematan
      operationId: list_embed_keys
      x-status: implemented
      x-min-role: superadmin
      security: [{ bearerAuth: [] }]
      description: |
        Semua kunci, termasuk yang nonaktif, urut dari yang paling lama dibuat,
        beserta jumlah pertanyaan 30 hari terakhir dan waktu pertanyaan terakhir
        dari situs itu.
      responses:
        '200':
          description: Semua kunci
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EmbedKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

    post:
      tags: [admin-embed-keys]
      summary: Buat kunci sematan untuk satu situs
      operationId: create_embed_key
      x-status: implemented
      x-min-role: superadmin
      security: [{ bearerAuth: [] }]
      description: |
        Kuncinya dibuat server dan langsung aktif. Balasan membawa
        `embed_code` siap tempel.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmbedKeyCreate' }
      responses:
        '201':
          description: Kunci dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmbedKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/admin/embed-keys/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [admin-embed-keys]
      summary: Ubah nama, daftar situs, atau status aktif kunci sematan
      operationId: update_embed_key
      x-status: implemented
      x-min-role: superadmin
      security: [{ bearerAuth: [] }]
      description: |
        Berlaku saat panel dibuka berikutnya. Kunci yang dinonaktifkan juga
        menolak pertanyaan dari panel yang sedang terbuka (403). Kuncinya sendiri
        tidak berubah, jadi situs penyemat tidak perlu mengganti kodenya.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmbedKeyUpdate' }
      responses:
        '200':
          description: Tersimpan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmbedKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

    delete:
      tags: [admin-embed-keys]
      summary: Hapus kunci sematan secara permanen
      operationId: delete_embed_key
      x-status: implemented
      x-min-role: superadmin
      security: [{ bearerAuth: [] }]
      description: |
        Situs yang masih memasangnya harus diberi kunci baru. Percakapan dari
        situs itu tetap tersimpan, hanya tidak lagi tertaut ke kunci mana pun.
        Untuk menghentikan sementara, nonaktifkan lewat PATCH.
      responses:
        '204':
          description: Terhapus
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

# =============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token dari `POST /api/admin/login`. Hanya untuk endpoint admin.

  parameters:
    SessionIdHeader:
      name: X-Session-Id
      in: header
      required: false
      description: |
        Pembatasan laju per sesi (FR-9). Bila tidak dikirim, sistem jatuh ke
        pembatasan per IP -- yang di jaringan kampus dipakai bersama ratusan
        mahasiswa, sehingga jauh lebih mudah kena batas. Kirimkan nilai yang
        sama dengan `session_id` di body.
      schema: { type: string, minLength: 8, maxLength: 128 }

    EmbedKeyHeader:
      name: X-Embed-Key
      in: header
      required: false
      description: |
        Kunci situs penyemat, hanya dikirim panel `/embed` portal yang dimuat
        situs lain. Tanpa header = permintaan dari portal sendiri. Kunci yang
        tidak dikenal atau sudah dinonaktifkan dijawab 403.
      schema: { type: string, maxLength: 64 }

    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }

    LogRange:
      name: range
      in: query
      description: Rentang waktu. 7 hari adalah batas atas karena masa simpan log.
      schema: { type: string, enum: [24h, 7d], default: 24h }

  responses:
    ValidationError:
      description: Body permintaan tidak sah
      content:
        application/json:
          schema: { $ref: '#/components/schemas/HTTPValidationError' }

    RateLimited:
      description: |
        Melebihi batas laju (FR-9): per IP, per `X-Session-Id`, atau per kunci
        sematan -- mana pun yang lebih dulu penuh (`RATE_LIMIT_*` di `.env`).
        Permintaan yang ditolak tidak ikut menghabiskan jatah. Menilai jawaban
        (`/api/feedback`) punya jatah sendiri, terpisah dari bertanya.
      headers:
        Retry-After:
          description: Detik sampai boleh mencoba lagi.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            detail: Terlalu banyak pertanyaan dalam waktu singkat. Coba lagi sebentar lagi.

    KillSwitchEngaged:
      description: |
        Layanan chat dimatikan operator (FR-9), atau otomatis karena pertanyaan
        hari ini melewati `CHAT_DAILY_LIMIT`. Frontend menampilkan `detail` apa
        adanya -- kalimatnya sudah memuat kontak manusia sebagai jalan keluar.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            detail: >-
              Layanan chat sedang dinonaktifkan sementara. Silakan hubungi Front
              Office INSTIKI: Telepon (0361) 256995 / WhatsApp 0813-3896-9832.

    Unauthorized:
      description: |
        Token tidak ada, tidak valid, atau kedaluwarsa; akun sudah dinonaktifkan
        atau dihapus; atau kata sandi sudah diganti sejak token terbit. Frontend
        menghapus sesi dan kembali ke halaman login.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    Forbidden:
      description: |
        Level akun di bawah `x-min-role` operasi ini, atau staf/dosen menyentuh
        dokumen unit lain. Sesi tetap berlaku; `detail` siap tampil.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    NotFound:
      description: Sumber daya tidak ditemukan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    InvalidEmbedKey:
      description: |
        `X-Embed-Key` dikirim tetapi kuncinya tidak dikenal atau sudah
        dinonaktifkan dari dashboard. Frontend menampilkan `detail` apa adanya.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            detail: >-
              Asisten tidak tersedia di situs ini. Silakan hubungi pengelola situs,
              atau ajukan pertanyaan lewat portal akademik.

  examples:
    NormalAnswer:
      summary: Jawaban bersumber dokumen
      value:
        kind: answer
        message_id: 9c3e1a44-6b2d-4f51-8a70-2d9b5c1e7f03
