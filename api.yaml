      tags: [admin-kualitas]
      summary: Tandai pertanyaan sudah ditindaklanjuti
      operationId: resolve_unanswered
      x-status: implemented
      x-min-role: admin
      security: [{ bearerAuth: [] }]
      description: |
        Ditandai `resolved` setelah dokumen yang menjawabnya diunggah. Ini
        bukan sekadar penanda kerapian -- selisih antara pertanyaan masuk dan
        pertanyaan terselesaikan adalah ukuran apakah sistem benar-benar
        membaik.

        Satu PATCH mengubah satu baris. Untuk menandai satu kelompok AD-4,
        kirim PATCH untuk setiap id di `UnansweredGroup.ids`.
