        '401': { $ref: '#/components/responses/TidakBerwenang' }
        '403': { $ref: '#/components/responses/Terlarang' }
        '422':
          description: Rentang tanggal tidak sah
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

