      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KillSwitchState' }
        '401': { $ref: '#/components/responses/TidakBerwenang' }
        '403': { $ref: '#/components/responses/Terlarang' }

    post:
      tags: [admin-operasional]
      summary: Nyalakan atau matikan kill switch
      operationId: set_kill_switch
      x-status: implemented
      x-min-role: superadmin
      security: [{ bearerAuth: [] }]
      description: |
        FR-9. Mematikan layanan chat dengan cepat saat insiden, tanpa menunggu
        deploy ulang.

        `alasan` wajib diisi saat menyalakan: insiden tanpa catatan alasan tidak
        bisa diaudit setelahnya. Dashboard admin tetap hidup saat kill switch
