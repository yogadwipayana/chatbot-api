        top_score: null

  schemas:
    # --- Chat --------------------------------------------------------------
    OutcomeKind:
      type: string
      enum: [answer, refusal, support, smalltalk, rejected]
      description: |
        Menentukan cara frontend menampilkan balasan. Hanya `answer` yang
        membawa sitasi; `refusal`, `support`, `smalltalk`, dan `rejected`
        tidak pernah.

    TurnIn:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          pattern: '^(user|assistant)$'
          description: '`system` sengaja tidak diterima -- itu jalur injeksi.'
        content:
          type: string
          description: |
            Dipotong server menjadi 2000 karakter pertama, bukan ditolak: awal
            jawaban sudah cukup sebagai konteks pertanyaan lanjutan.

    ChatRequest:
      type: object
      required: [question, session_id, nim]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 500
          description: |
            Pertanyaan apa adanya. Server yang menyanitasi dan membungkusnya
            dengan delimiter; klien tidak perlu (dan tidak boleh) ikut memproses.

            500 = panjang maksimum pertanyaan siap klik (entri tanya jawab admin).
            Kotak pertanyaan portal sendiri membatasi 200.
        session_id:
          type: string
          minLength: 8
          maxLength: 128
          description: |
            Dibangkitkan klien, disimpan di localStorage. JANGAN isi dengan NIM,
            email, atau apa pun yang dapat mengenali orang (PRD §11).
        history:
          type: array
          default: []
          maxItems: 50
          description: |
            Riwayat percakapan. Hanya 3 pesan terakhir yang dipakai untuk
            penulisan ulang query (FR-4); sisanya dibuang server, dan lebih dari
            50 ditolak 422.
          items: { $ref: '#/components/schemas/TurnIn' }
        unit:
          type: [string, 'null']
          maxLength: 200
          description: |
            `name` dari `GET /api/units`. Retrieval -- vektor maupun fulltext --
            hanya mencari di dokumen unit ini. Kosongkan atau kirim null untuk
            mencari di semua unit.

            Dicocokkan tanpa peduli huruf besar dan spasi berlebih. Nama yang
            tidak terdaftar, atau unit yang sudah dinonaktifkan, dijawab 422;
            muat ulang daftar unit bila itu terjadi.

            Bila tidak ada dokumen unit ini yang cukup relevan, balasannya
            penolakan biasa (`kind: refusal`) yang menyebut unit tersebut dan
            menyarankan memilih unit lain atau semua unit.
        nim:
          type: string
          pattern: '^\d{10}$'
          description: |
            Wajib. NIM INSTIKI `aaabbddccc`: angkatan (2000 + dua digit
            pertama), fakultas dan prodi (digit 4-7, `code` dari
            `GET /api/programs`), lalu nomor urut. Mis. `2401010101` =
            Informatika angkatan 2024. Kode prodi yang tidak dikenal atau
            angkatan yang belum tiba dijawab 422. Tidak dicocokkan ke data
            mahasiswa.

            Prodi dan angkatannya -- bukan NIM-nya -- diteruskan ke LLM supaya
            ketentuan yang di dokumen berbeda per prodi atau angkatan (harga
            sertifikasi per prodi, kurikulum per angkatan) dijawab untuk
            penanya. BUKAN filter retrieval. NIM utuh dicatat di
            `messages.meta` bersama prodi dan angkatannya; untuk balasan
            `support` hanya NIM-nya (PRD §11).

    CitationOut:
      type: object
      required: [title, page, document_id, file_path]
      description: |
        Isi kartu sitasi FE-2. Cukup untuk membuka PDF tepat di halamannya:
        `GET /api/documents/{document_id}/file#page={page}`.
      properties:
        title: { type: string }
        page: { type: integer, minimum: 1 }
        document_id: { type: string, format: uuid }
        file_path:
          type: string
          description: |
            Lintasan internal. Untuk ditampilkan, bukan untuk diakses langsung.
            Kosong bila sumbernya entri tanya jawab, yang memang tak berberkas.
        type:
          $ref: '#/components/schemas/DocumentType'
          default: pdf
          description: |
            `tanya_jawab` berarti tidak ada PDF yang bisa dibuka dan nomor
            halamannya tidak berarti apa-apa: tampilkan kartunya tanpa tautan
            dan tanpa "hal. N".

    ContactOut:
      type: object
      required: [unit, service_hours, contact]
      description: Isi banner eskalasi FE-3.
      properties:
        unit: { type: string }
        service_hours: { type: string }
        contact: { type: string }

    UnitOut:
      type: object
      required: [name]
      description: Satu pilihan di menu unit chatbot.
      properties:
        name:
          type: string
          description: Dikirim kembali apa adanya sebagai `unit` pada `POST /api/chat`.
        description:
          type: [string, 'null']
          description: Kepanjangan atau cakupan layanan, untuk teks bantu di menu.

    ProgramOut:
      type: object
      required: [code, name, level, faculty]
      description: Satu program studi, untuk mengurai dan menampilkan NIM di widget.
      properties:
        code:
          type: string
          description: Digit 4-7 NIM.
        name: { type: string }
        level:
          type: string
          description: '`S1` atau `S2`.'
        faculty: { type: string }

    FaqQuestion:
      type: object
      required: [question]
      description: Satu pertanyaan siap klik di menu topik chatbot.
      properties:
        question:
          type: string
          description: |
            Dikirim apa adanya sebagai `question` pada `POST /api/chat`, bersama
            unit topiknya.

    ChatResponse:
      type: object
      required: [kind, text, citations, contacts, escalated]
      properties:
        kind: { $ref: '#/components/schemas/OutcomeKind' }
        message_id:
          type: [string, 'null']
          format: uuid
          description: |
            Id jawaban di tabel `messages`, dipakai `POST /api/feedback`. Bernilai
            null bila pencatatan ke database gagal (jawaban tetap terkirim) --
            frontend harus menyembunyikan tombol 👍/👎 saat null, bukan mengirim
            id kosong.
        text: { type: string }
        citations:
          type: array
          default: []
          description: |
            Hanya dokumen yang benar-benar dikutip di `text`, urut kemunculan --
            bukan seluruh chunk yang terambil retrieval. Retrieval mengambil
            beberapa chunk sebagai konteks LLM; menampilkan semuanya sebagai
            "Sumber" memaksa mahasiswa menebak kartu mana yang relevan.

            Sitasi ke dokumen di luar konteks (sumber karangan) tidak pernah
            ikut: tautannya buntu. Jawaban tanpa satu pun penanda sitasi
            (misalnya balasan sapaan dari LLM) tidak membawa kartu sama sekali:
            chunk yang tidak dikutip bukan sumber jawabannya.

            Selalu kosong bila `kind` bukan `answer`.
          items: { $ref: '#/components/schemas/CitationOut' }
        contacts:
          type: array
          default: []
          items: { $ref: '#/components/schemas/ContactOut' }
        escalated:
          type: boolean
          default: false
          description: Tampilkan banner FE-3 bila true.
        top_score:
          type: [number, 'null']
          description: |
            Skor kemiripan mentah tertinggi, bukan skor RRF. Jangan ditampilkan
            ke mahasiswa -- angka ini untuk AD-6 dan kalibrasi ambang.

    FeedbackRequest:
      type: object
      required: [message_id, helpful]
      properties:
        message_id: { type: string, format: uuid }
        helpful: { type: boolean, description: 'true = 👍, false = 👎' }
        comment: { type: [string, 'null'], maxLength: 1000 }

    Suggestion:
      type: object
      required: [text]
      properties:
        text: { type: string }

    HealthResponse:
      type: object
      required: [status, chat_enabled]
      properties:
        status: { type: string, const: ok }
        chat_enabled:
          type: boolean
          description: false berarti kill switch aktif; proses tetap sehat.
        kill_switch_reason: { type: [string, 'null'] }
        tracing_enabled:
          type: boolean
          description: >-
            Apakah trace FR-8 benar-benar terkirim ke LangSmith. Tracing yang mati
            tidak menjatuhkan satu pun permintaan, sehingga tanpa baris ini ia hanya
            ketahuan saat ada jawaban buruk yang jejaknya ternyata tidak pernah ada.

    # --- Admin -------------------------------------------------------------
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 256 }

    TokenResponse:
      type: object
      required: [access_token, token_type]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: bearer }

    Document:
      type: object
      required: [id, title, unit, updated_at, is_active, chunk_count, stale]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        unit: { type: string }
        effective_year: { type: [integer, 'null'] }
        valid_until:
          type: [string, 'null']
          format: date
          description: |
            null berarti berlaku tanpa batas. Lewat tanggal ini, dokumen
            berhenti terambil retrieval secara otomatis (FR-2) -- tidak perlu
            ada yang ingat menonaktifkannya.
        updated_at: { type: string, format: date-time }
        is_active: { type: boolean }
        chunk_count: { type: integer, minimum: 0 }
        stale:
          type: boolean
          description: |
            Badge peringatan AD-2: lebih dari 6 bulan tidak diperbarui, atau
            sudah lewat `valid_until`.
        uploaded_by:
          type: [string, 'null']
          description: |
            Email admin pengunggah. PRD §12 memitigasi dokumen usang lewat admin
            bernama -- badge tanpa nama penanggung jawab mudah diabaikan.

    DocumentPage:
      type: object
      required: [items, total, stale_count]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Document' }
        total:
          type: integer
          minimum: 0
          description: Jumlah dokumen yang cocok dengan filter, untuk paginasi.
        stale_count:
          type: integer
          minimum: 0
          description: |
            Dokumen AKTIF yang perlu ditinjau, tidak terpengaruh filter. Untuk
            lencana angka di navigasi AD-2. Dokumen nonaktif tidak dihitung
            karena sudah tidak terambil retrieval.

    DocumentUpload:
      type: object
      required: [file, title, unit]
      properties:
        file: { type: string, format: binary, description: Berkas PDF. }
        title: { type: string, minLength: 3, maxLength: 500 }
        unit:
          type: string
          minLength: 2
          maxLength: 200
          description: |
            Salah satu `name` dari `GET /api/units`, tanpa peduli huruf besar.
            Yang tersimpan selalu ejaan resmi; nama lain dijawab 422.
        effective_year: { type: [integer, 'null'], minimum: 2000, maximum: 2100 }
        valid_until: { type: [string, 'null'], format: date }

    DocumentUpdate:
      type: object
      description: Hanya field yang dikirim yang diubah.
      properties:
        title: { type: string, minLength: 3, maxLength: 500 }
        unit:
          type: string
          minLength: 2
          maxLength: 200
          description: |
            Salah satu `name` dari `GET /api/units`, tanpa peduli huruf besar.
            Yang tersimpan selalu ejaan resmi; nama lain dijawab 422.
        effective_year: { type: [integer, 'null'], minimum: 2000, maximum: 2100 }
        valid_until:
          type: [string, 'null']
          format: date
          description: Kirim null untuk menjadikan dokumen berlaku tanpa batas.
        is_active: { type: boolean }

    IngestionResult:
      type: object
      required: [document_id, page_count, chunk_count]
      properties:
        document_id: { type: string, format: uuid }
        page_count: { type: integer, minimum: 1 }
        chunk_count: { type: integer, minimum: 1 }
        warnings:
          type: array
          items: { type: string }
          description: |
            Catatan mutu dokumen yang baru diunggah -- mis. teks yang terbaca
            sangat sedikit karena isinya didominasi tangkapan layar. Bukan
            galat: unggahan tetap berhasil. Tiap entri berupa kalimat siap
            tampil untuk admin.

    Chunk:
      type: object
      required: [id, content, page, position]
      properties:
        id: { type: string, format: uuid }
        content: { type: string }
        page: { type: integer, minimum: 1 }
        position: { type: integer, minimum: 0 }

    DocumentType:
      type: string
      enum: [pdf, tanya_jawab]
      description: |
        Asal isi sebuah sumber. `pdf`: berkas resmi yang diunggah admin, punya
        berkas yang dapat dibuka dan nomor halaman yang berarti. `tanya_jawab`:
        diketik admin di dashboard, tanpa berkas -- kartu sumbernya tidak boleh
        dibuat sebagai tautan.

    FaqEntry:
      type: object
      required: [id, question, answer, unit, updated_at, is_active, chunk_count, stale]
      properties:
        id: { type: string, format: uuid }
        question:
          type: string
          description: Sekaligus judul sumber pada kartu sitasi yang dilihat mahasiswa.
        answer: { type: string }
        unit: { type: string }
        valid_until:
          type: [string, 'null']
          format: date
          description: |
            null berarti berlaku tanpa batas. Lewat tanggal ini, entri berhenti
            terambil retrieval secara otomatis (FR-2).
        updated_at: { type: string, format: date-time }
        is_active: { type: boolean }
        chunk_count:
          type: integer
          minimum: 0
          description: |
            Jawaban pendek menjadi satu potongan; jawaban panjang dipecah, dan
            setiap potongan tetap membawa pertanyaannya.
        stale:
          type: boolean
          description: |
            Sama dengan dokumen: lebih dari 6 bulan tidak diperbarui, atau sudah
            lewat masa berlaku.
        uploaded_by:
          type: [string, 'null']
          description: Email admin yang terakhir menyimpannya.

    FaqPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FaqEntry' }
        total:
          type: integer
          minimum: 0
          description: Jumlah entri yang cocok dengan filter, untuk paginasi.

    FaqEntryCreate:
      type: object
      required: [question, answer, unit]
      properties:
        question: { type: string, minLength: 5, maxLength: 500 }
        answer: { type: string, minLength: 10, maxLength: 5000 }
        unit:
          type: string
          minLength: 2
          maxLength: 200
          description: |
            Salah satu `name` dari `GET /api/units`, tanpa peduli huruf besar.
            Yang tersimpan selalu ejaan resmi; nama lain dijawab 422.
        valid_until: { type: [string, 'null'], format: date }

    FaqEntryUpdate:
      type: object
      description: Hanya field yang dikirim yang diubah.
      properties:
        question: { type: string, minLength: 5, maxLength: 500 }
        answer: { type: string, minLength: 10, maxLength: 5000 }
        unit:
          type: string
          minLength: 2
          maxLength: 200
          description: |
            Salah satu `name` dari `GET /api/units`, tanpa peduli huruf besar.
            Yang tersimpan selalu ejaan resmi; nama lain dijawab 422.
        valid_until:
          type: [string, 'null']
          format: date
          description: Kirim null untuk menjadikan entri berlaku tanpa batas.
        is_active: { type: boolean }

    UnansweredUpdate:
      type: object
      required: [resolved]
      properties:
        resolved: { type: boolean }

    UnansweredGroup:
      type: object
      required: [ids, sample_question, count, last_asked_at, resolved]
      properties:
        ids:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
          description: |
            Seluruh baris `unanswered_questions` dalam kelompok. Menandai kelompok selesai
            berarti PATCH `/api/admin/unanswered/{id}` untuk setiap id.
        sample_question:
          type: string
          description: Satu pertanyaan mewakili kelompok, apa adanya seperti diketik.
        count: { type: integer, minimum: 1 }
        avg_top_score:
          type: [number, 'null']
          description: |
            Rata-rata skor tertinggi kelompok ini. Nilai yang mendekati ambang
            menandakan dokumennya mungkin sudah ada tetapi retrieval-nya meleset;
            nilai sangat rendah menandakan dokumennya memang belum ada.
        last_asked_at: { type: string, format: date-time }
        resolved: { type: boolean }
        unit:
          type: [string, 'null']
          description: |
            Unit yang dipilih mahasiswa saat menanyakan `sample_question`. Chatbot
            hanya mencari di dokumen unit itu, jadi uji coba ulangnya juga harus
            memakai unit ini. Null bila pesan asalnya sudah terhapus dari log.

    FeedbackItem:
      type: object
      required: [id, message_id, helpful, created_at, answer]
      description: Satu penilaian FE-5 beserta pasangan pertanyaan-jawaban yang dinilai.
      properties:
        id: { type: string, format: uuid }
        message_id:
          type: string
          format: uuid
          description: Baris `messages` yang dinilai, selalu jawaban chatbot.
        helpful: { type: boolean }
        created_at: { type: string, format: date-time }
        answer: { type: string, description: Isi jawaban chatbot apa adanya. }
        comment:
          type: [string, 'null']
          description: |
            Isian bebas mahasiswa. FE-5 satu klik tanpa modal, jadi sebagian
            besar umpan balik tidak memilikinya.
        question:
          type: [string, 'null']
          description: |
            Pesan mahasiswa terakhir sebelum jawaban ini. Null bila pesannya
            sudah terhapus dari log. Pertanyaan sensitif (FR-7) berisi penanda
            tetap, bukan kalimat aslinya.
        kind:
          type: [string, 'null']
          description: |
            `messages.meta.kind` apa adanya. Sengaja bukan enum tertutup: nilai
            baru di backend tidak boleh membuat halaman ini gagal memuat.
        top_score:
          type: [number, 'null']
          description: Skor mentah tertinggi saat jawaban itu dibuat.
        unit:
          type: [string, 'null']
          description: Unit yang dipilih mahasiswa saat bertanya (`messages.meta.unit`).

    FeedbackPage:
      type: object
      required: [items, total, positive_count, negative_count]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FeedbackItem' }
        total:
          type: integer
          minimum: 0
          description: Jumlah baris yang cocok dengan seluruh filter, untuk penomoran halaman.
        positive_count: { type: integer, minimum: 0 }
        negative_count:
          type: integer
          minimum: 0
          description: |
            Keduanya dihitung mengabaikan filter `helpful`, sehingga jumlah pada
            kedua tab tetap terlihat saat salah satunya sedang dipilih.

    RetrievedChunk:
      type: object
      required: [chunk_id, title, page, content, rrf_score, raw_scores, ranks]
      description: Rincian diagnosa AD-6.
      properties:
        chunk_id: { type: string, format: uuid }
        document_id: { type: [string, 'null'], format: uuid }
        title: { type: string }
        type:
          $ref: '#/components/schemas/DocumentType'
          default: pdf
        page: { type: integer }
        content: { type: string }
        rrf_score:
          type: number
          description: Skor gabungan. Berbasis peringkat -- jangan pakai untuk menilai relevansi.
        raw_scores:
          type: object
          description: |
            Skor mentah per sumber. Ini yang menentukan penolakan (FR-3). Kunci
            sebuah sumber hanya ada bila sumber itu menemukan chunk ini: chunk
            yang hanya ditemukan fulltext tidak punya `vector`.
          properties:
            vector: { type: number, description: 'Cosine similarity, 0..1.' }
            fulltext: { type: number, description: '`ts_rank` Postgres.' }
        ranks:
          type: object
          description: Peringkat 1-based di tiap sumber. Kunci absen seperti `raw_scores`.
          properties:
            vector: { type: integer }
            fulltext: { type: integer }
        neighbor_of:
          type: [string, 'null']
          format: uuid
          description: >-
            `chunk_id` sumbernya bila ini potongan lanjutan (`RETRIEVAL_NEIGHBORS`):
            ikut karena sumbernya, jadi `raw_scores` dan `ranks` kosong.

    GateVerdictOut:
      type: object
      required: [label, confidence, blocked]
      description: Vonis gerbang (JEV atau saringan aturan) pada uji coba ini.
      properties:
        label: { type: string, enum: [academic, smalltalk, nonsense, malicious, out_of_scope] }
        confidence: { type: number }
        blocked: { type: boolean }
        error:
          type: [string, 'null']
          description: Galat atau lewat tenggat; saat itu pesan diteruskan (fail-open).
        source:
          type: string
          enum: [jev, rules]
          default: jev
          description: >-
            `rules` = saringan aturan tanpa model (pesan acak, tawa, basa-basi tentang
            PANDU, upaya manipulasi); keyakinannya selalu 1.

    TestQueryRequest:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 2000 }
        vector_threshold:
          description: |
            Timpa ambang vektor untuk uji coba ini saja, untuk mencari nilai yang
            pas. Tidak mengubah ambang yang berlaku bagi mahasiswa.
          type: [number, 'null']
          minimum: 0
          maximum: 1
        unit:
          type: [string, 'null']
          maxLength: 200
          description: |
            Sama dengan `ChatRequest.unit`: uji apa yang dilihat mahasiswa yang
            memilih unit ini di menu chatbot.

    ThresholdValues:
      type: object
      required: [vector, fulltext]
      description: Ambang yang benar-benar dipakai pada uji coba ini (FR-3).
      properties:
        vector: { type: number }
        fulltext: { type: number }

    TestQueryResponse:
      type: object
      required: [kind, text, retrieved, decision, thresholds, contacts, escalated, latency_ms]
      properties:
        kind: { $ref: '#/components/schemas/OutcomeKind' }
        text: { type: string }
        rewritten_query: { type: [string, 'null'] }
        retrieved:
          type: array
          description: >-
            Tetap terisi saat ditolak ambang atau LLM -- justru itu yang perlu dilihat
            saat diagnosa. Kosong bila diblokir gerbang JEV: pencariannya dihentikan.
          items: { $ref: '#/components/schemas/RetrievedChunk' }
        decision:
          type: [object, 'null']
          description: >-
            null bila alur berhenti sebelum ambang dinilai: konseling (FR-7),
            sapaan, atau diblokir gerbang JEV.
          required: [decision, reason]
          properties:
            decision: { type: string, enum: [proceed, refuse] }
            reason: { type: string, enum: [ok, no_results, below_threshold] }
            top_vector_score: { type: [number, 'null'] }
            top_lexical_score: { type: [number, 'null'] }
        thresholds: { $ref: '#/components/schemas/ThresholdValues' }
        llm_called: { type: boolean, default: false }
        refusal_source:
          type: [string, 'null']
          enum: [threshold, llm, null]
          description: >-
            Hanya untuk `refusal`: `threshold` = ambang FR-3 menolak dan LLM tidak
            dipanggil; `llm` = lolos ambang, tetapi LLM menilai isinya tidak menjawab.
        rejection_source:
          type: [string, 'null']
          enum: [jev, rules, llm, null]
          description: >-
            Hanya untuk `rejected`: gerbang JEV, saringan aturan, atau LLM penjawab
            yang membalas `[DI_LUAR_TOPIK]` (pertanyaan di luar urusan kampus).
        gate:
          description: >-
            Vonis gerbang JEV atau saringan aturan; null bila JEV mati dan aturan
            meloloskan pesan, atau alur berhenti sebelumnya.
          oneOf:
            - $ref: '#/components/schemas/GateVerdictOut'
            - type: 'null'
        contacts:
          type: array
          description: Kontak yang akan dilihat mahasiswa untuk pertanyaan yang sama (FE-3, FE-4).
          items: { $ref: '#/components/schemas/ContactOut' }
        escalated: { type: boolean }
        latency_ms: { type: integer, minimum: 0 }
        langsmith_run_id:
          type: [string, 'null']
          description: >-
            Akar trace LangSmith untuk uji coba ini -- mencakup penulisan ulang query,
            retrieval, dan penyusunan jawaban sekaligus. Null bila tracing mati
            (LANGSMITH_TRACING=false atau LANGSMITH_API_KEY kosong).

    DailyVolume:
      type: object
      required: [date, count]
      properties:
        date: { type: string, format: date }
        count: { type: integer, minimum: 0 }

    TopicCount:
      type: object
      required: [topic, count]
      properties:
        topic:
          type: string
          description: |
            Nilai `RiskTopic` (FR-6): `deadline`, `syarat_kelulusan`,
            `pembayaran`, `sanksi`, `drop_out`. Label tampilan diserahkan ke
            frontend.
        count: { type: integer, minimum: 1 }

    KindBreakdown:
      type: object
      required: [answer, refusal, support, smalltalk, rejected]
      description: Jumlah balasan per `kind` dalam rentang.
      properties:
        answer: { type: integer, minimum: 0 }
        refusal: { type: integer, minimum: 0 }
        support: { type: integer, minimum: 0 }
        smalltalk:
          type: integer
          minimum: 0
          description: |
            Sapaan dan basa-basi. Bukan pertanyaan administrasi -- jangan
            disandingkan dengan `answer` seolah keduanya setara.
        rejected:
          type: integer
          minimum: 0
          description: Dihentikan gerbang JEV (nonsense, manipulasi, di luar topik).

    Stats:
      type: object
      required:
        - since
        - until
        - total_conversations
        - total_questions
        - kind_breakdown
        - feedback_count
        - positive_feedback_ratio
        - unanswered_ratio
        - daily_volume
        - top_topics
        - running_cost_usd
        - messages_without_cost_estimate
        - latency_p95_ms
        - questions_with_profile
        - program_breakdown
        - intake_year_breakdown
      properties:
        since: { type: string, format: date }
        until: { type: string, format: date }
        total_conversations:
          type: integer
          description: |
            Konteks, BUKAN ukuran keberhasilan. PRD §3 menetapkannya sebagai
            anti-metrik: volume tinggi bisa berarti jawabannya buruk sehingga
            mahasiswa bertanya berulang kali. Satu percakapan = pesan dari
            `session_id` yang sama dengan jeda di bawah 30 menit.
        total_questions: { type: integer }
        kind_breakdown: { $ref: '#/components/schemas/KindBreakdown' }
        feedback_count: { type: integer, minimum: 0 }
        positive_feedback_ratio:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: Target PRD §3 >= 0.75. null bila belum ada umpan balik.
        unanswered_ratio:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: Target PRD §3 < 0.15. null bila belum ada pertanyaan.
        daily_volume:
          type: array
          description: Satu entri per hari dalam rentang, termasuk hari tanpa pertanyaan.
          items: { $ref: '#/components/schemas/DailyVolume' }
        top_topics:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/TopicCount' }
        running_cost_usd:
          type: number
          description: Estimasi dari token terpakai, bukan dari API penagihan.
        messages_without_cost_estimate:
          type: integer
          minimum: 0
          description: |
            Jawaban yang memanggil LLM tetapi modelnya belum punya tarif di
            `app/observability/costs.py`. Lebih dari nol berarti
            `running_cost_usd` KURANG dari biaya sebenarnya -- tampilkan
            sebagai peringatan, jangan sebagai biaya nol.
        latency_p95_ms:
          type: [integer, 'null']
          description: |
            Persentil 95 waktu proses jawaban lengkap. Target PRD §11 (first
            token < 3000 ms) diukur di LangSmith; angka ini batas atasnya.
        questions_with_profile:
          type: integer
          minimum: 0
          description: |
            Pertanyaan yang tercatat bersama prodi dan angkatan penanya.
            Penyebut kedua rincian di bawah -- BUKAN `total_questions`, yang
            juga memuat pertanyaan dari sebelum NIM tersedia (NIM opsional
            2026-10-05, wajib sejak 2026-10-07). Balasan `support` tidak pernah
            ikut: profilnya sengaja tidak dicatat.
        program_breakdown:
          type: array
          description: |
            Semua prodi terdaftar (`GET /api/programs`), juga yang nol;
            terbanyak lebih dulu.
          items: { $ref: '#/components/schemas/ProgramStat' }
        intake_year_breakdown:
          type: array
          description: Hanya angkatan yang pernah bertanya; terbaru lebih dulu.
          items: { $ref: '#/components/schemas/IntakeYearStat' }

    ProgramStat:
      type: object
      required: [code, name, level, question_count, refusal_count]
      properties:
        code: { type: string }
        name:
          type: string
          description: Nama prodi; kodenya sendiri bila prodi itu sudah tidak terdaftar.
        level: { type: [string, 'null'] }
        question_count: { type: integer, minimum: 0 }
        refusal_count:
          type: integer
          minimum: 0
          description: Yang ditolak (`kind = refusal`) -- celah dokumen untuk prodi ini.

    IntakeYearStat:
      type: object
      required: [intake_year, question_count, refusal_count]
      properties:
        intake_year: { type: integer }
        question_count: { type: integer, minimum: 0 }
        refusal_count: { type: integer, minimum: 0 }

    CostByModel:
      type: object
      required: [type, model, call_count, input_tokens, output_tokens, tokens, cost_usd]
      properties:
        type:
          type: string
          enum: [llm_chat, embedding_chat]
        model: { type: string }
        call_count: { type: integer, minimum: 0 }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        tokens: { type: integer, minimum: 0 }
        cost_usd: { type: number, minimum: 0 }

    DailyCost:
      type: object
      required: [date, call_count, llm_tokens, embed_tokens, llm_cost_usd, embedding_cost_usd, cost_usd]
      properties:
        date: { type: string, format: date }
        call_count: { type: integer, minimum: 0 }
        llm_tokens: { type: integer, minimum: 0 }
        embed_tokens: { type: integer, minimum: 0 }
        llm_cost_usd: { type: number, minimum: 0 }
        embedding_cost_usd: { type: number, minimum: 0 }
        cost_usd: { type: number, minimum: 0 }

    Costs:
      type: object
      required: [since, until, llm_call_count, input_tokens, output_tokens, total_tokens, cost_usd, llm_cost_usd, chat_embed_tokens, chat_embed_cost_usd, chat_embed_count, llm_calls_without_cost, chat_embeds_without_cost, model_breakdown, daily_costs]
      properties:
        since: { type: string, format: date }
        until: { type: string, format: date }
        llm_call_count: { type: integer, minimum: 0 }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        total_tokens: { type: integer, minimum: 0 }
        cost_usd: { type: number, minimum: 0 }
        llm_cost_usd: { type: number, minimum: 0 }
        chat_embed_tokens: { type: integer, minimum: 0 }
        chat_embed_cost_usd: { type: number, minimum: 0 }
        chat_embed_count: { type: integer, minimum: 0 }
        llm_calls_without_cost: { type: integer, minimum: 0 }
        chat_embeds_without_cost: { type: integer, minimum: 0 }
        model_breakdown:
          type: array
          items: { $ref: '#/components/schemas/CostByModel' }
        daily_costs:
          type: array
          items: { $ref: '#/components/schemas/DailyCost' }

    LogSummary:
      type: object
      required: [since, until, turn_count, p50_total_ms, p95_total_ms, error_turn_count, error_ratio, cancelled_turn_count, jev_blocked_count, jev_blocked_ratio, error_log_count, per_node, exit_points, per_hour]
      properties:
        since: { type: string }
        until: { type: string }
        turn_count: { type: integer, minimum: 0 }
        p50_total_ms: { type: [number, 'null'] }
        p95_total_ms: { type: [number, 'null'] }
        error_turn_count: { type: integer, minimum: 0 }
        error_ratio: { type: number, minimum: 0 }
        cancelled_turn_count: { type: integer, minimum: 0, description: 'Giliran `dibatalkan` (mahasiswa menghentikan jawaban atau menutup panel). Tidak termasuk `error_turn_count`.' }
        jev_blocked_count: { type: integer, minimum: 0 }
        jev_blocked_ratio: { type: number, minimum: 0 }
        error_log_count: { type: integer, minimum: 0, description: 'Log ERROR ke atas. Untuk role admin, log audit tidak dihitung.' }
        per_node:
          type: array
          items: { $ref: '#/components/schemas/NodeStat' }
        exit_points:
          type: array
          items: { $ref: '#/components/schemas/ExitPoint' }
        per_hour:
          type: array
          items: { $ref: '#/components/schemas/HourlyLogStat' }

    NodeStat:
      type: object
      required: [node, count, p50_ms, p95_ms, error]
      properties:
        node: { type: string }
        count: { type: integer, minimum: 0 }
        p50_ms: { type: [number, 'null'] }
        p95_ms: { type: [number, 'null'] }
        error: { type: integer, minimum: 0 }

    ExitPoint:
      type: object
      required: [node, count]
      properties:
        node: { type: string, description: 'Node terakhir yang berjalan, yaitu tempat giliran berhenti.' }
        count: { type: integer, minimum: 0 }

    HourlyLogStat:
      type: object
      required: [hour, turn_count, p95_total_ms, error_turn_count, error_log_count]
      properties:
        hour: { type: string, description: 'Awal jam, UTC, mis. `2026-09-25T03:00:00Z`.' }
        turn_count: { type: integer, minimum: 0 }
        p95_total_ms: { type: [number, 'null'] }
        error_turn_count: { type: integer, minimum: 0 }
        error_log_count: { type: integer, minimum: 0 }

    TurnOut:
      type: object
      required: [turn_id, timestamp, endpoint, session_id, message_id, unit, outcome, last_node, total_ms, ttft_ms, status, langsmith_run_id]
      properties:
        turn_id: { type: string }
        timestamp: { type: string }
        endpoint: { type: string, enum: [chat, chat_stream] }
        session_id: { type: [string, 'null'] }
        message_id: { type: [string, 'null'], description: 'Tautan ke `messages` di Postgres; teks percakapan hanya ada di sana.' }
        unit: { type: [string, 'null'] }
        outcome: { type: [string, 'null'] }
        last_node: { type: [string, 'null'] }
        total_ms: { type: [integer, 'null'] }
        ttft_ms: { type: [integer, 'null'], description: 'Waktu sampai token pertama; hanya untuk chat_stream yang memanggil LLM.' }
        status: { type: string, enum: [ok, error, dibatalkan] }
        langsmith_run_id: { type: [string, 'null'] }

    TurnPage:
      type: object
      required: [total, items]
      properties:
        total: { type: integer, minimum: 0 }
        items:
          type: array
          items: { $ref: '#/components/schemas/TurnOut' }

    NodeRunOut:
      type: object
      required: [node, position, started_at, duration_ms, status, error_type, error_message, detail]
      properties:
        node: { type: string }
        position: { type: integer }
        started_at: { type: string }
        duration_ms: { type: number }
        status: { type: string, enum: [ok, error] }
        error_type: { type: [string, 'null'] }
        error_message: { type: [string, 'null'] }
        detail: { type: object, additionalProperties: true }

    AppLogOut:
      type: object
      required: [id, timestamp, level, logger, message, location, traceback, turn_id]
      properties:
        id: { type: integer }
        timestamp: { type: string }
        level: { type: string }
        logger: { type: string }
        message: { type: string }
        location: { type: [string, 'null'] }
        traceback: { type: [string, 'null'] }
        turn_id: { type: [string, 'null'] }

    TurnDetail:
      type: object
      required: [turn_id, timestamp, endpoint, session_id, message_id, unit, outcome, last_node, total_ms, ttft_ms, status, langsmith_run_id, nodes, logs]
      description: TurnOut ditambah node dan log giliran itu.
      properties:
        turn_id: { type: string }
        timestamp: { type: string }
        endpoint: { type: string, enum: [chat, chat_stream] }
        session_id: { type: [string, 'null'] }
        message_id: { type: [string, 'null'], description: 'Tautan ke `messages` di Postgres; teks percakapan hanya ada di sana.' }
        unit: { type: [string, 'null'] }
        outcome: { type: [string, 'null'] }
        last_node: { type: [string, 'null'] }
        total_ms: { type: [integer, 'null'] }
        ttft_ms: { type: [integer, 'null'], description: 'Waktu sampai token pertama; hanya untuk chat_stream yang memanggil LLM.' }
        status: { type: string, enum: [ok, error, dibatalkan] }
        langsmith_run_id: { type: [string, 'null'] }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/NodeRunOut' }
        logs:
          type: array
          description: Log yang muncul selama giliran ini berjalan.
          items: { $ref: '#/components/schemas/AppLogOut' }

    AppLogPage:
      type: object
      required: [total, items, loggers]
      properties:
        total: { type: integer, minimum: 0 }
        items:
          type: array
          items: { $ref: '#/components/schemas/AppLogOut' }
        loggers:
          type: array
          items: { type: string }

    KillSwitchRequest:
      type: object
      required: [engaged]
      properties:
        engaged: { type: boolean }
        reason:
          type: [string, 'null']
          maxLength: 500
          description: Wajib diisi (bukan spasi saja) saat `engaged` true. Diabaikan saat false.

    KillSwitchState:
      type: object
      required: [engaged]
      properties:
        engaged: { type: boolean }
        reason: { type: [string, 'null'] }
        engaged_at: { type: [string, 'null'], format: date-time }
        engaged_by:
          type: [string, 'null']
          description: |
            Email admin yang menyalakan, atau `konfigurasi server` bila
            dinyalakan lewat `KILL_SWITCH_ENABLED`.

    # --- Konfigurasi runtime ------------------------------------------------
    RuntimeConfigValues:
      type: object
      required:
        [retrieval_candidates, retrieval_top_n, rrf_k, rrf_weight_vector,
         rrf_weight_fulltext, vector_threshold, lexical_threshold, chunk_size,
         chunk_overlap, chat_daily_limit]
      description: |
        Parameter yang dapat disetel dari dashboard. Namanya sengaja sama persis
        dengan variabel di `.env` dan field `app.config.Settings`.
      properties:
        retrieval_candidates:
          type: integer
          description: Kandidat per sumber sebelum fusi (FR-2).
        retrieval_top_n:
          type: integer
          description: Potongan yang masuk konteks LLM setelah RRF.
        rrf_k:
          type: integer
          description: Konstanta peredam RRF; makin besar, makin rata pengaruh peringkat.
        rrf_weight_vector:
          type: number
          description: Bobot pencarian vektor saat fusi. 0 mematikan sumber ini.
        rrf_weight_fulltext:
          type: number
          description: Bobot pencarian kata saat fusi. 0 mematikan sumber ini.
        vector_threshold:
          type: number
          description: Kemiripan vektor minimum sebelum LLM dipanggil (FR-3).
        lexical_threshold:
          type: number
          description: Skor `ts_rank` minimum sebelum LLM dipanggil (FR-3).
        chunk_size:
          type: integer
          description: Pagar atas panjang satu potongan, dalam token (FR-1).
        chunk_overlap:
          type: integer
          description: Tumpang tindih antar potongan saat satu bagian harus dipecah.
        chat_daily_limit:
          type: integer
          description: |
            Pertanyaan per hari dari semua sumber (zona `TIMEZONE`). Terlampaui =
            kill switch menyala otomatis sampai superadmin menyalakan layanan
            lagi. 0 = tanpa batas.

    RuntimeConfigUpdate:
      type: object
      additionalProperties: false
      description: |
        Hanya field yang dikirim yang diubah; `null` mengembalikan field itu ke
        nilai `.env`. Batas di sini adalah pagar kewarasan; aturan antar-field
        diperiksa terhadap hasil gabungannya.
      properties:
        retrieval_candidates: { type: [integer, 'null'], minimum: 1, maximum: 100 }
        retrieval_top_n: { type: [integer, 'null'], minimum: 1, maximum: 50 }
        rrf_k: { type: [integer, 'null'], minimum: 1, maximum: 1000 }
        rrf_weight_vector: { type: [number, 'null'], minimum: 0, maximum: 5 }
        rrf_weight_fulltext: { type: [number, 'null'], minimum: 0, maximum: 5 }
        vector_threshold: { type: [number, 'null'], minimum: 0, maximum: 1 }
        lexical_threshold: { type: [number, 'null'], minimum: 0, maximum: 1 }
        chunk_size: { type: [integer, 'null'], minimum: 200, maximum: 4000 }
        chunk_overlap: { type: [integer, 'null'], minimum: 0, maximum: 1000 }
        chat_daily_limit: { type: [integer, 'null'], minimum: 0, maximum: 1000000 }

    RuntimeConfig:
      type: object
      required: [values, env_values, overridden, chat_model, embed_model, api_key_set]
      properties:
        values:
          allOf: [{ $ref: '#/components/schemas/RuntimeConfigValues' }]
          description: Yang dipakai layanan saat ini.
        env_values:
          allOf: [{ $ref: '#/components/schemas/RuntimeConfigValues' }]
          description: Yang tertulis di `.env` server.
        overridden:
          type: array
          items: { type: string }
          description: Nama parameter yang sedang ditimpa dari dashboard.
        chat_model: { type: string }
        embed_model: { type: string }
        base_url:
          type: [string, 'null']
          description: Endpoint OpenAI-compatible; kosong berarti OpenAI resmi.
        api_key_set:
          type: boolean
          description: Kuncinya sendiri tidak pernah dikirim ke peramban.
        updated_at: { type: [string, 'null'], format: date-time }
        updated_by: { type: [string, 'null'] }
        warning:
          type: [string, 'null']
          description: |
            Terisi bila nilai tersimpan tidak dapat dipakai (mis. `.env` berubah
            sehingga kombinasinya melanggar aturan) dan layanan sementara
            kembali ke `.env`.

    # --- Akun dan level akses ----------------------------------------------
    AdminRole:
      type: string
      enum: [staf, admin, superadmin]
      description: |
        Level bertingkat; setiap level mencakup hak level di bawahnya. `staf`
        ditampilkan sebagai "Staf/Dosen".

    AdminUser:
      type: object
      required: [id, email, role, is_active]
      description: Akun dashboard. Hash kata sandi tidak pernah dikirim.
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/AdminRole' }
        is_active: { type: boolean }
        name: { type: [string, 'null'] }
        unit:
          type: [string, 'null']
          description: |
            Wajib untuk `staf`: membatasi dokumen yang dapat dikelola. Untuk level
            lain hanya keterangan.
        created_at: { type: [string, 'null'], format: date-time }
        last_login_at: { type: [string, 'null'], format: date-time }

    AdminUserCreate:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/AdminRole' }
        name: { type: [string, 'null'], maxLength: 200 }
        unit:
          type: [string, 'null']
          maxLength: 200
          description: |
            Wajib bila `role` bernilai `staf`. Salah satu `name` dari
            `GET /api/units`; nama lain dijawab 422.

    AdminUserUpdate:
      type: object
      description: Hanya field yang dikirim yang diubah. Field tak dikenal ditolak.
      properties:
        name: { type: [string, 'null'], maxLength: 200 }
        role: { $ref: '#/components/schemas/AdminRole' }
        unit:
          type: [string, 'null']
          maxLength: 200
          description: Salah satu `name` dari `GET /api/units`; nama lain dijawab 422.
        is_active: { type: boolean }

    AdminUserCreated:
      type: object
      required: [user, temporary_password]
      properties:
        user: { $ref: '#/components/schemas/AdminUser' }
        temporary_password:
          type: string
          description: Ditampilkan SEKALI dan tidak dapat diambil lagi.

    TemporaryPassword:
      type: object
      required: [temporary_password]
      properties:
        temporary_password: { type: string }

    AdminUnit:
      type: object
      required: [name, sort_order, is_active, document_count, account_count]
      description: Satu unit layanan, termasuk yang nonaktif.
      properties:
        name:
          type: string
          description: Kunci utama; nilai yang tersimpan di `documents.unit` dan `admins.unit`.
        description:
          type: [string, 'null']
          description: Teks bantu di menu chatbot.
        sort_order: { type: integer, description: Urutan tampil di menu; kecil lebih dulu. }
        is_active:
          type: boolean
          description: false = tersembunyi dari menu chatbot dan pilihan isian baru.
        document_count: { type: integer }
        account_count: { type: integer }

    AdminUnitCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Spasi berlebih dirapikan; tidak boleh memuat `/`.
        description: { type: [string, 'null'], maxLength: 500 }
        sort_order:
          type: [integer, 'null']
          minimum: 0
          maximum: 10000
          description: Kosong = diletakkan paling akhir.

    AdminUnitUpdate:
      type: object
      description: Hanya field yang dikirim yang diubah. Field tak dikenal ditolak.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 500 }
        sort_order: { type: integer, minimum: 0, maximum: 10000 }
        is_active: { type: boolean }

    EmbedKeyInfo:
      type: object
      required: [allowed_origins]
      properties:
        allowed_origins:
          type: array
          items: { type: string }
          description: Menjadi `frame-ancestors` halaman `/embed`. Kosong = situs mana pun.

    EmbedKey:
      type: object
      required: [key, name, allowed_origins, is_active, created_at, questions_30d]
      description: Satu kunci sematan beserta pemakaiannya.
      properties:
        key:
          type: string
          description: '`emb_` + 24 karakter. Bukan rahasia: tertulis di kode sumber situs penyemat.'
        name: { type: string, description: Nama situs, hanya untuk dashboard. }
        allowed_origins:
          type: array
          items: { type: string }
          description: Situs yang boleh memuat panel. Kosong = situs mana pun.
        is_active: { type: boolean }
        created_by: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        questions_30d:
          type: integer
          description: Pertanyaan mahasiswa dari situs ini, 30 hari terakhir.
        last_used_at:
          type: [string, 'null']
          format: date-time
          description: Pertanyaan terakhir dari situs ini; null = belum pernah dipakai.
        embed_code:
          type: [string, 'null']
          description: Baris `<script>` siap tempel; null bila `PORTAL_URL` API belum diisi.

    EmbedKeyCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        allowed_origins:
          type: array
          maxItems: 20
          items: { type: string }
          description: |
            Alamat situs lengkap tanpa path, mis. `https://pmb.instiki.ac.id`.
            Wildcard subdomain `https://*.instiki.ac.id` diterima. Garis miring
            akhir, huruf besar, dan port bawaan dirapikan; duplikat dibuang.
            Kosong = situs mana pun.

    EmbedKeyUpdate:
      type: object
      description: Hanya field yang dikirim yang diubah. Field tak dikenal ditolak.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        allowed_origins:
          type: array
          maxItems: 20
          items: { type: string }
        is_active: { type: boolean }

    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, minLength: 1, maxLength: 256 }
        new_password:
          type: string
          minLength: 12
          maxLength: 72
          description: Maksimal 72 byte (batas bcrypt).

    # --- Galat -------------------------------------------------------------
    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: |
            Kalimat siap tampil. Untuk endpoint admin bahasanya non-teknis
            (PRD §9: "dokumen sedang diproses", bukan "embedding in progress").

    ValidationError:
      type: object
      required: [loc, msg, type]
      properties:
        loc:
          type: array
          items:
            type: [string, integer]
        msg: { type: string }
        type: { type: string }

    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items: { $ref: '#/components/schemas/ValidationError' }
