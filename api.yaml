    post:
      tags: [admin-auth]
      summary: Ganti kata sandi sendiri
      operationId: change_my_password
      x-status: implemented
      x-min-role: staf
      security: [{ bearerAuth: [] }]
      description: |
        Dipakai terutama setelah menerima kata sandi sementara dari superadmin.
        Semua sesi lain akun ini langsung berakhir. Balasan membawa token baru
        untuk sesi yang dipakai mengganti, jadi tidak perlu masuk ulang.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChange' }
      responses:
        '200':
          description: Tersimpan; token baru
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400':
          description: Kata sandi lama salah, atau kata sandi baru sama dengan yang lama
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/TidakBerwenang' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/admin/users:
    get:
      tags: [admin-pengguna]
      summary: Daftar akun dashboard
      operationId: list_users
      x-status: implemented
      x-min-role: superadmin
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Akun, superadmin lebih dulu
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/TidakBerwenang' }
        '403': { $ref: '#/components/responses/Terlarang' }

    post:
      tags: [admin-pengguna]
      summary: Buat akun dashboard
      operationId: create_user
      x-status: implemented
      x-min-role: superadmin
      security: [{ bearerAuth: [] }]
      description: |
        Kata sandi dibangkitkan server dan dikembalikan SEKALI sebagai
        `password_sementara`. Superadmin tidak memilih kata sandi orang lain,
        sehingga tidak ada yang mengetahui kata sandi akhir selain pemiliknya
        setelah ia menggantinya.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserCreate' }
      responses:
        '201':
          description: Akun dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserCreated' }
        '401': { $ref: '#/components/responses/TidakBerwenang' }
        '403': { $ref: '#/components/responses/Terlarang' }
        '409':
          description: Email sudah dipakai, atau level staf tanpa unit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/admin/users/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [admin-pengguna]
      summary: Ubah nama, level, unit, atau status aktif
      operationId: update_user
      x-status: implemented
      x-min-role: superadmin
      security: [{ bearerAuth: [] }]
      description: |
        Berlaku pada permintaan berikutnya akun tersebut. Ditolak 409 bila:
        superadmin menurunkan level atau menonaktifkan dirinya sendiri,
        superadmin aktif terakhir disingkirkan, atau level staf tanpa unit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserUpdate' }
      responses:
        '200':
          description: Tersimpan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/TidakBerwenang' }
        '403': { $ref: '#/components/responses/Terlarang' }
        '404': { $ref: '#/components/responses/TidakDitemukan' }
        '409':
          description: Melanggar aturan akun (lihat deskripsi)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

    delete:
      tags: [admin-pengguna]
      summary: Hapus akun dashboard
      operationId: delete_user
      x-status: implemented
      x-min-role: superadmin
      security: [{ bearerAuth: [] }]
      description: |
        Permanen; frontend WAJIB meminta konfirmasi. Untuk menghentikan akses
        sementara, nonaktifkan saja. Dokumen unggahan akun ini tidak ikut
        terhapus.
      responses:
        '204':
          description: Terhapus
        '401': { $ref: '#/components/responses/TidakBerwenang' }
        '403': { $ref: '#/components/responses/Terlarang' }
        '404': { $ref: '#/components/responses/TidakDitemukan' }
        '409':
          description: Menghapus diri sendiri, atau superadmin aktif terakhir
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/admin/users/{user_id}/reset-password:
    post:
      tags: [admin-pengguna]
      summary: Atur ulang kata sandi akun lain
      operationId: reset_user_password
      x-status: implemented
      x-min-role: superadmin
      security: [{ bearerAuth: [] }]
      description: |
        Membangkitkan kata sandi sementara baru (ditampilkan sekali) dan
        mengakhiri semua sesi akun itu. Untuk akun sendiri gunakan
        `POST /api/admin/me/password`.
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Kata sandi sementara
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemporaryPassword' }
        '401': { $ref: '#/components/responses/TidakBerwenang' }
        '403': { $ref: '#/components/responses/Terlarang' }
        '404': { $ref: '#/components/responses/TidakDitemukan' }
        '409':
          description: Mengatur ulang akun sendiri
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

# =============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token dari `POST /api/admin/login`. Hanya untuk endpoint admin.

  parameters:
    SessionIdHeader:
      name: X-Session-Id
      in: header
      required: false
      description: |
        Pembatasan laju per sesi (FR-9). Bila tidak dikirim, sistem jatuh ke
        pembatasan per IP -- yang di jaringan kampus dipakai bersama ratusan
        mahasiswa, sehingga jauh lebih mudah kena batas. Kirimkan nilai yang
        sama dengan `session_id` di body.
      schema: { type: string, minLength: 8, maxLength: 128 }

    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }

  responses:
    ValidationError:
      description: Body permintaan tidak sah
      content:
        application/json:
          schema: { $ref: '#/components/schemas/HTTPValidationError' }

    RateLimited:
      description: Melebihi batas laju (FR-9)
      headers:
        Retry-After:
          description: Detik sampai boleh mencoba lagi.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            detail: Terlalu banyak pertanyaan dalam waktu singkat. Coba lagi sebentar lagi.

    KillSwitchAktif:
      description: |
        Layanan chat dimatikan operator (FR-9). Frontend menampilkan `detail`
        apa adanya -- kalimatnya sudah memuat kontak manusia sebagai jalan keluar.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            detail: >-
              Layanan chat sedang dinonaktifkan sementara. Silakan hubungi Biro
              Administrasi Akademik pada jam kerja.

    TidakBerwenang:
      description: |
        Token tidak ada, tidak valid, atau kedaluwarsa; akun sudah dinonaktifkan
        atau dihapus; atau kata sandi sudah diganti sejak token terbit. Frontend
        menghapus sesi dan kembali ke halaman login.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    Terlarang:
      description: |
        Level akun di bawah `x-min-role` operasi ini, atau staf/dosen menyentuh
        dokumen unit lain. Sesi tetap berlaku; `detail` siap tampil.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    TidakDitemukan:
      description: Sumber daya tidak ditemukan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  examples:
    JawabanNormal:
      summary: Jawaban bersumber dokumen
      value:
        kind: answer
        message_id: 9c3e1a44-6b2d-4f51-8a70-2d9b5c1e7f03
        text: >-
          Pengisian KRS semester ganjil dibuka pada 1-7 Agustus 2025
          [Panduan Akademik 2025, hal. 12].
        citations:
          - judul: Panduan Akademik 2025
            halaman: 12
            document_id: 3f1a2b3c-4d5e-6f70-8192-a3b4c5d6e7f8
            file_path: storage/documents/3f1a2b3c-4d5e-6f70-8192-a3b4c5d6e7f8.pdf
        contacts: []
        escalated: false
        top_score: 0.82

    JawabanEskalasi:
      summary: Topik berisiko tinggi -- jawaban plus banner kontak (FR-6, FE-3)
      value:
        kind: answer
        message_id: 1b7d9e02-3c4f-4a56-9d81-5e6f7a8b9c0d
        text: >-
          Batas akhir pembayaran UKT semester ganjil adalah 25 Agustus 2025
          [Panduan Akademik 2025, hal. 30].
        citations:
          - judul: Panduan Akademik 2025
            halaman: 30
            document_id: 3f1a2b3c-4d5e-6f70-8192-a3b4c5d6e7f8
            file_path: storage/documents/3f1a2b3c-4d5e-6f70-8192-a3b4c5d6e7f8.pdf
        contacts:
          - unit: Biro Administrasi Akademik
            jam_layanan: Senin-Jumat, 08.00-15.00
            kontak: akademik@kampus.ac.id
          - unit: Biro Keuangan
            jam_layanan: Senin-Jumat, 08.00-14.00
            kontak: keuangan@kampus.ac.id
        escalated: true
        top_score: 0.77

    Penolakan:
      summary: Retrieval terlalu lemah -- LLM tidak dipanggil (FR-3)
      value:
        kind: refusal
        message_id: 5a2c8f13-7e94-4b60-a1d2-3f4e5a6b7c8d
        text: |-
          Maaf, saya tidak menemukan informasi ini di dokumen resmi yang saya miliki. Supaya Anda tidak mendapat jawaban yang keliru, silakan tanyakan langsung ke:

          - Biro Administrasi Akademik (Senin-Jumat, 08.00-15.00): akademik@kampus.ac.id
        citations: []
        contacts:
          - unit: Biro Administrasi Akademik
            jam_layanan: Senin-Jumat, 08.00-15.00
            kontak: akademik@kampus.ac.id
        escalated: true
        top_score: 0.11

    Dukungan:
      summary: Pertanyaan bernuansa tekanan mental (FR-7)
      value:
        kind: support
        message_id: 7e1f4a90-2b35-4c68-9d0a-1b2c3d4e5f60
        text: |-
          Terima kasih sudah menyampaikan ini. Yang Anda rasakan wajar dan Anda tidak sendirian. Saya tidak bisa membantu urusan seperti ini lewat dokumen administrasi, tetapi ada orang yang siap mendengarkan:

          - Unit Bimbingan & Konseling Kampus (Senin-Jumat, 08.00-15.00): konseling@kampus.ac.id
          - Dosen Wali (Sesuai jadwal bimbingan): Hubungi melalui program studi
        citations: []
        contacts:
          - unit: Unit Bimbingan & Konseling Kampus
            jam_layanan: Senin-Jumat, 08.00-15.00
            kontak: konseling@kampus.ac.id
          - unit: Dosen Wali
            jam_layanan: Sesuai jadwal bimbingan
            kontak: Hubungi melalui program studi
        escalated: true
        top_score: null

    Sapaan:
      summary: Sapaan atau basa-basi -- tanpa retrieval dan tanpa LLM
      value:
        kind: smalltalk
        message_id: 2d4f6a81-9c03-4e57-b1a2-6f7e8d9c0b1a
        text: >-
          Halo! Saya asisten administrasi akademik. Silakan tanyakan urusan
          administrasi Anda -- jawaban saya bersumber dari dokumen resmi kampus
          dan selalu menyertakan sumbernya.
        citations: []
        contacts: []
        escalated: false
        top_score: null

  schemas:
    # --- Chat --------------------------------------------------------------
    OutcomeKind:
      type: string
      enum: [answer, refusal, support, smalltalk]
      description: |
        Menentukan cara frontend menampilkan balasan. Hanya `answer` yang
        membawa sitasi; `refusal`, `support`, dan `smalltalk` tidak pernah.

    TurnIn:
      type: object
      required: [role, konten]
      properties:
        role:
          type: string
          pattern: '^(user|assistant)$'
          description: '`system` sengaja tidak diterima -- itu jalur injeksi.'
        konten: { type: string }

    ChatRequest:
      type: object
      required: [question, session_id]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 2000
          description: |
            Pertanyaan apa adanya. Server yang menyanitasi dan membungkusnya
            dengan delimiter; klien tidak perlu (dan tidak boleh) ikut memproses.
        session_id:
          type: string
          minLength: 8
          maxLength: 128
          description: |
            Dibangkitkan klien, disimpan di localStorage. JANGAN isi dengan NIM,
            email, atau apa pun yang dapat mengenali orang (PRD §11).
        history:
          type: array
          default: []
          description: |
            Riwayat percakapan. Hanya 3 pesan terakhir yang dipakai untuk
            penulisan ulang query (FR-4); mengirim lebih banyak tidak menambah
            ketepatan tetapi menaikkan biaya.
          items: { $ref: '#/components/schemas/TurnIn' }

    CitationOut:
      type: object
      required: [judul, halaman, document_id, file_path]
      description: |
        Isi kartu sitasi FE-2. Cukup untuk membuka PDF tepat di halamannya:
        `GET /api/documents/{document_id}/file#page={halaman}`.
      properties:
        judul: { type: string }
        halaman: { type: integer, minimum: 1 }
        document_id: { type: string, format: uuid }
        file_path:
          type: string
          description: |
            Lintasan internal. Untuk ditampilkan, bukan untuk diakses langsung.
            Kosong bila sumbernya entri tanya jawab, yang memang tak berberkas.
        jenis:
          $ref: '#/components/schemas/JenisDokumen'
          default: pdf
          description: |
            `tanya_jawab` berarti tidak ada PDF yang bisa dibuka dan nomor
            halamannya tidak berarti apa-apa: tampilkan kartunya tanpa tautan
            dan tanpa "hal. N".

    ContactOut:
      type: object
      required: [unit, jam_layanan, kontak]
      description: Isi banner eskalasi FE-3.
      properties:
        unit: { type: string }
        jam_layanan: { type: string }
        kontak: { type: string }

    ChatResponse:
      type: object
      required: [kind, text, citations, contacts, escalated]
      properties:
        kind: { $ref: '#/components/schemas/OutcomeKind' }
        message_id:
          type: [string, 'null']
          format: uuid
          description: |
            Id jawaban di tabel `messages`, dipakai `POST /api/feedback`. Bernilai
            null bila pencatatan ke database gagal (jawaban tetap terkirim) --
            frontend harus menyembunyikan tombol 👍/👎 saat null, bukan mengirim
            id kosong.
        text: { type: string }
        citations:
          type: array
          default: []
          description: |
            Hanya dokumen yang benar-benar dikutip di `text`, urut kemunculan --
            bukan seluruh chunk yang terambil retrieval. Retrieval mengambil
            beberapa chunk sebagai konteks LLM; menampilkan semuanya sebagai
            "Sumber" memaksa mahasiswa menebak kartu mana yang relevan.

            Sitasi ke dokumen di luar konteks (sumber karangan) tidak pernah
            ikut: tautannya buntu. Jawaban tanpa satu pun penanda sitasi jatuh
            kembali ke seluruh chunk terambil, supaya verifikasi tetap mungkin.

            Selalu kosong bila `kind` bukan `answer`.
          items: { $ref: '#/components/schemas/CitationOut' }
        contacts:
          type: array
          default: []
          items: { $ref: '#/components/schemas/ContactOut' }
        escalated:
          type: boolean
          default: false
          description: Tampilkan banner FE-3 bila true.
        top_score:
          type: [number, 'null']
          description: |
            Skor kemiripan mentah tertinggi, bukan skor RRF. Jangan ditampilkan
            ke mahasiswa -- angka ini untuk AD-6 dan kalibrasi ambang.

    FeedbackRequest:
      type: object
      required: [message_id, helpful]
      properties:
        message_id: { type: string, format: uuid }
        helpful: { type: boolean, description: 'true = 👍, false = 👎' }
        catatan: { type: [string, 'null'], maxLength: 1000 }

    Suggestion:
      type: object
      required: [teks]
      properties:
        teks: { type: string }

    HealthResponse:
      type: object
      required: [status, chat_enabled]
      properties:
        status: { type: string, const: ok }
        chat_enabled:
          type: boolean
          description: false berarti kill switch aktif; proses tetap sehat.
        kill_switch_reason: { type: [string, 'null'] }

    # --- Admin -------------------------------------------------------------
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 256 }

    TokenResponse:
      type: object
      required: [access_token, token_type]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: bearer }

    Document:
      type: object
      required: [id, judul, unit, updated_at, is_active, jumlah_chunk, stale]
      properties:
        id: { type: string, format: uuid }
        judul: { type: string }
        unit: { type: string }
        tahun_berlaku: { type: [integer, 'null'] }
        valid_until:
          type: [string, 'null']
          format: date
          description: |
            null berarti berlaku tanpa batas. Lewat tanggal ini, dokumen
            berhenti terambil retrieval secara otomatis (FR-2) -- tidak perlu
            ada yang ingat menonaktifkannya.
        updated_at: { type: string, format: date-time }
        is_active: { type: boolean }
        jumlah_chunk: { type: integer, minimum: 0 }
        stale:
          type: boolean
          description: |
            Badge peringatan AD-2: lebih dari 6 bulan tidak diperbarui, atau
            sudah lewat `valid_until`.
        uploaded_by:
          type: [string, 'null']
          description: |
            Email admin pengunggah. PRD §12 memitigasi dokumen usang lewat admin
            bernama -- badge tanpa nama penanggung jawab mudah diabaikan.

    DocumentPage:
      type: object
      required: [items, total, jumlah_stale]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Document' }
        total:
          type: integer
          minimum: 0
          description: Jumlah dokumen yang cocok dengan filter, untuk paginasi.
        jumlah_stale:
          type: integer
          minimum: 0
          description: |
            Dokumen AKTIF yang perlu ditinjau, tidak terpengaruh filter. Untuk
            lencana angka di navigasi AD-2. Dokumen nonaktif tidak dihitung
            karena sudah tidak terambil retrieval.

    DocumentUpload:
      type: object
      required: [file, judul, unit]
      properties:
        file: { type: string, format: binary, description: Berkas PDF. }
        judul: { type: string, minLength: 3, maxLength: 500 }
        unit: { type: string, minLength: 2, maxLength: 200 }
        tahun_berlaku: { type: [integer, 'null'], minimum: 2000, maximum: 2100 }
        valid_until: { type: [string, 'null'], format: date }

    DocumentUpdate:
      type: object
      description: Hanya field yang dikirim yang diubah.
      properties:
        judul: { type: string, minLength: 3, maxLength: 500 }
        unit: { type: string, minLength: 2, maxLength: 200 }
        tahun_berlaku: { type: [integer, 'null'], minimum: 2000, maximum: 2100 }
        valid_until:
          type: [string, 'null']
          format: date
          description: Kirim null untuk menjadikan dokumen berlaku tanpa batas.
        is_active: { type: boolean }

    IngestionResult:
      type: object
      required: [document_id, jumlah_halaman, jumlah_chunk]
      properties:
        document_id: { type: string, format: uuid }
        jumlah_halaman: { type: integer, minimum: 1 }
        jumlah_chunk: { type: integer, minimum: 1 }
        peringatan:
          type: array
          items: { type: string }
          description: |
            Catatan mutu dokumen yang baru diunggah -- mis. teks yang terbaca
            sangat sedikit karena isinya didominasi tangkapan layar. Bukan
            galat: unggahan tetap berhasil. Tiap entri berupa kalimat siap
            tampil untuk admin.

    Chunk:
      type: object
      required: [id, konten, halaman, urutan]
      properties:
        id: { type: string, format: uuid }
        konten: { type: string }
        halaman: { type: integer, minimum: 1 }
        urutan: { type: integer, minimum: 0 }

    JenisDokumen:
      type: string
      enum: [pdf, tanya_jawab]
      description: |
        Asal isi sebuah sumber. `pdf`: berkas resmi yang diunggah admin, punya
        berkas yang dapat dibuka dan nomor halaman yang berarti. `tanya_jawab`:
        diketik admin di dashboard, tanpa berkas -- kartu sumbernya tidak boleh
        dibuat sebagai tautan.

    FaqEntry:
      type: object
      required: [id, pertanyaan, jawaban, unit, updated_at, is_active, jumlah_chunk, stale]
      properties:
        id: { type: string, format: uuid }
        pertanyaan:
          type: string
          description: Sekaligus judul sumber pada kartu sitasi yang dilihat mahasiswa.
        jawaban: { type: string }
        unit: { type: string }
        valid_until:
          type: [string, 'null']
          format: date
          description: |
            null berarti berlaku tanpa batas. Lewat tanggal ini, entri berhenti
            terambil retrieval secara otomatis (FR-2).
        updated_at: { type: string, format: date-time }
        is_active: { type: boolean }
        jumlah_chunk:
          type: integer
          minimum: 0
          description: |
            Jawaban pendek menjadi satu potongan; jawaban panjang dipecah, dan
            setiap potongan tetap membawa pertanyaannya.
        stale:
          type: boolean
          description: |
            Sama dengan dokumen: lebih dari 6 bulan tidak diperbarui, atau sudah
            lewat masa berlaku.
        uploaded_by:
          type: [string, 'null']
          description: Email admin yang terakhir menyimpannya.

    FaqPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FaqEntry' }
        total:
          type: integer
          minimum: 0
          description: Jumlah entri yang cocok dengan filter, untuk paginasi.

    FaqEntryCreate:
      type: object
      required: [pertanyaan, jawaban, unit]
      properties:
        pertanyaan: { type: string, minLength: 5, maxLength: 500 }
        jawaban: { type: string, minLength: 10, maxLength: 5000 }
        unit: { type: string, minLength: 2, maxLength: 200 }
        valid_until: { type: [string, 'null'], format: date }

    FaqEntryUpdate:
      type: object
      description: Hanya field yang dikirim yang diubah.
      properties:
        pertanyaan: { type: string, minLength: 5, maxLength: 500 }
        jawaban: { type: string, minLength: 10, maxLength: 5000 }
        unit: { type: string, minLength: 2, maxLength: 200 }
        valid_until:
          type: [string, 'null']
          format: date
          description: Kirim null untuk menjadikan entri berlaku tanpa batas.
        is_active: { type: boolean }

    UnansweredUpdate:
      type: object
      required: [resolved]
      properties:
        resolved: { type: boolean }

    UnansweredGroup:
      type: object
      required: [ids, contoh_pertanyaan, jumlah, terakhir_ditanyakan, resolved]
      properties:
        ids:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
          description: |
            Seluruh baris `unanswered` dalam kelompok. Menandai kelompok selesai
            berarti PATCH `/api/admin/unanswered/{id}` untuk setiap id.
        contoh_pertanyaan:
          type: string
          description: Satu pertanyaan mewakili kelompok, apa adanya seperti diketik.
        jumlah: { type: integer, minimum: 1 }
        top_score_rata2:
          type: [number, 'null']
          description: |
            Rata-rata skor tertinggi kelompok ini. Nilai yang mendekati ambang
            menandakan dokumennya mungkin sudah ada tetapi retrieval-nya meleset;
            nilai sangat rendah menandakan dokumennya memang belum ada.
        terakhir_ditanyakan: { type: string, format: date-time }
        resolved: { type: boolean }

    FeedbackItem:
      type: object
      required: [id, message_id, helpful, created_at, jawaban]
      description: Satu penilaian FE-5 beserta pasangan pertanyaan-jawaban yang dinilai.
      properties:
        id: { type: string, format: uuid }
        message_id:
          type: string
          format: uuid
          description: Baris `messages` yang dinilai, selalu jawaban chatbot.
        helpful: { type: boolean }
        created_at: { type: string, format: date-time }
        jawaban: { type: string, description: Isi jawaban chatbot apa adanya. }
        catatan:
          type: [string, 'null']
          description: |
            Isian bebas mahasiswa. FE-5 satu klik tanpa modal, jadi sebagian
            besar umpan balik tidak memilikinya.
        pertanyaan:
          type: [string, 'null']
          description: |
            Pesan mahasiswa terakhir sebelum jawaban ini. Null bila pesannya
            sudah terhapus dari log. Pertanyaan sensitif (FR-7) berisi penanda
            tetap, bukan kalimat aslinya.
        kind:
          type: [string, 'null']
          description: |
            `messages.meta.kind` apa adanya. Sengaja bukan enum tertutup: nilai
            baru di backend tidak boleh membuat halaman ini gagal memuat.
        top_score:
          type: [number, 'null']
          description: Skor mentah tertinggi saat jawaban itu dibuat.

    FeedbackPage:
      type: object
      required: [items, total, jumlah_positif, jumlah_negatif]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FeedbackItem' }
        total:
          type: integer
          minimum: 0
          description: Jumlah baris yang cocok dengan seluruh filter, untuk penomoran halaman.
        jumlah_positif: { type: integer, minimum: 0 }
        jumlah_negatif:
          type: integer
          minimum: 0
          description: |
            Keduanya dihitung mengabaikan filter `helpful`, sehingga jumlah pada
            kedua tab tetap terlihat saat salah satunya sedang dipilih.

    RetrievedChunk:
      type: object
      required: [chunk_id, judul, halaman, konten, rrf_score, raw_scores, ranks]
      description: Rincian diagnosa AD-6.
      properties:
        chunk_id: { type: string, format: uuid }
        document_id: { type: [string, 'null'], format: uuid }
        judul: { type: string }
        jenis:
          $ref: '#/components/schemas/JenisDokumen'
          default: pdf
        halaman: { type: integer }
        konten: { type: string }
        rrf_score:
          type: number
          description: Skor gabungan. Berbasis peringkat -- jangan pakai untuk menilai relevansi.
        raw_scores:
          type: object
          description: |
            Skor mentah per sumber. Ini yang menentukan penolakan (FR-3). Kunci
            sebuah sumber hanya ada bila sumber itu menemukan chunk ini: chunk
            yang hanya ditemukan fulltext tidak punya `vector`.
          properties:
            vector: { type: number, description: 'Cosine similarity, 0..1.' }
            fulltext: { type: number, description: '`ts_rank` Postgres.' }
        ranks:
          type: object
          description: Peringkat 1-based di tiap sumber. Kunci absen seperti `raw_scores`.
          properties:
            vector: { type: integer }
            fulltext: { type: integer }

    TestQueryRequest:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 2000 }
        vector_threshold:
          description: |
            Timpa ambang vektor untuk uji coba ini saja, untuk mencari nilai yang
            pas. Tidak mengubah ambang yang berlaku bagi mahasiswa.
          type: [number, 'null']
          minimum: 0
          maximum: 1

    ThresholdValues:
      type: object
      required: [vector, fulltext]
      description: Ambang yang benar-benar dipakai pada uji coba ini (FR-3).
      properties:
        vector: { type: number }
        fulltext: { type: number }

    TestQueryResponse:
      type: object
      required: [kind, text, retrieved, decision, ambang, contacts, escalated, latency_ms]
      properties:
        kind: { $ref: '#/components/schemas/OutcomeKind' }
        text: { type: string }
        rewritten_query: { type: [string, 'null'] }
        retrieved:
          type: array
          description: Tetap terisi saat ditolak -- justru itu yang perlu dilihat saat diagnosa.
          items: { $ref: '#/components/schemas/RetrievedChunk' }
        decision:
          type: [object, 'null']
          description: null bila pertanyaan dialihkan ke konseling (FR-7) sebelum retrieval.
          required: [decision, reason]
          properties:
            decision: { type: string, enum: [proceed, refuse] }
            reason: { type: string, enum: [ok, no_results, below_threshold] }
            top_vector_score: { type: [number, 'null'] }
            top_lexical_score: { type: [number, 'null'] }
        ambang: { $ref: '#/components/schemas/ThresholdValues' }
        contacts:
          type: array
          description: Kontak yang akan dilihat mahasiswa untuk pertanyaan yang sama (FE-3, FE-4).
          items: { $ref: '#/components/schemas/ContactOut' }
        escalated: { type: boolean }
        latency_ms: { type: integer, minimum: 0 }
        langsmith_run_id:
          type: [string, 'null']
          description: Penghubung ke trace LangSmith. Selalu null sampai tracing dipasang.

    DailyVolume:
      type: object
      required: [tanggal, jumlah]
      properties:
        tanggal: { type: string, format: date }
        jumlah: { type: integer, minimum: 0 }

    TopicCount:
      type: object
      required: [topik, jumlah]
      properties:
        topik:
          type: string
          description: |
            Nilai `RiskTopic` (FR-6): `deadline`, `syarat_kelulusan`,
            `pembayaran`, `sanksi`, `drop_out`. Label tampilan diserahkan ke
            frontend.
        jumlah: { type: integer, minimum: 1 }

    KindBreakdown:
      type: object
      required: [answer, refusal, support, smalltalk]
      description: Jumlah balasan per `kind` dalam rentang.
      properties:
        answer: { type: integer, minimum: 0 }
        refusal: { type: integer, minimum: 0 }
        support: { type: integer, minimum: 0 }
        smalltalk:
          type: integer
          minimum: 0
          description: |
            Sapaan dan basa-basi. Bukan pertanyaan administrasi -- jangan
            disandingkan dengan `answer` seolah keduanya setara.

    Stats:
      type: object
      required:
        - sejak
        - sampai
        - total_percakapan
        - total_pertanyaan
        - rincian_jenis
        - jumlah_feedback
        - rasio_feedback_positif
        - rasio_tak_terjawab
        - volume_harian
        - topik_populer
        - biaya_usd_berjalan
        - pesan_tanpa_estimasi_biaya
        - latency_p95_ms
      properties:
        sejak: { type: string, format: date }
        sampai: { type: string, format: date }
        total_percakapan:
          type: integer
          description: |
            Konteks, BUKAN ukuran keberhasilan. PRD §3 menetapkannya sebagai
            anti-metrik: volume tinggi bisa berarti jawabannya buruk sehingga
            mahasiswa bertanya berulang kali. Satu percakapan = pesan dari
            `session_id` yang sama dengan jeda di bawah 30 menit.
        total_pertanyaan: { type: integer }
        rincian_jenis: { $ref: '#/components/schemas/KindBreakdown' }
        jumlah_feedback: { type: integer, minimum: 0 }
        rasio_feedback_positif:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: Target PRD §3 >= 0.75. null bila belum ada umpan balik.
        rasio_tak_terjawab:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: Target PRD §3 < 0.15. null bila belum ada pertanyaan.
        volume_harian:
          type: array
          description: Satu entri per hari dalam rentang, termasuk hari tanpa pertanyaan.
          items: { $ref: '#/components/schemas/DailyVolume' }
        topik_populer:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/TopicCount' }
        biaya_usd_berjalan:
          type: number
          description: Estimasi dari token terpakai, bukan dari API penagihan.
        pesan_tanpa_estimasi_biaya:
          type: integer
          minimum: 0
          description: |
            Jawaban yang memanggil LLM tetapi modelnya belum punya tarif di
            `app/observability/costs.py`. Lebih dari nol berarti
            `biaya_usd_berjalan` KURANG dari biaya sebenarnya -- tampilkan
            sebagai peringatan, jangan sebagai biaya nol.
        latency_p95_ms:
          type: [integer, 'null']
          description: |
            Persentil 95 waktu proses jawaban lengkap. Target PRD §11 (first
            token < 3000 ms) diukur di LangSmith; angka ini batas atasnya.

    CostByModel:
      type: object
      required: [jenis, model, jumlah_panggilan, input_tokens, output_tokens, tokens, biaya_usd]
      properties:
        jenis:
          type: string
          enum: [llm_chat, embedding_chat, embedding_ingestion]
        model: { type: string }
        jumlah_panggilan: { type: integer, minimum: 0 }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        tokens: { type: integer, minimum: 0 }
        biaya_usd: { type: number, minimum: 0 }

    DailyCost:
      type: object
      required: [tanggal, jumlah_panggilan, llm_tokens, embed_tokens, biaya_llm_usd, biaya_embedding_usd, biaya_ingestion_usd, biaya_usd]
      properties:
        tanggal: { type: string, format: date }
        jumlah_panggilan: { type: integer, minimum: 0 }
        llm_tokens: { type: integer, minimum: 0 }
        embed_tokens: { type: integer, minimum: 0 }
        biaya_llm_usd: { type: number, minimum: 0 }
        biaya_embedding_usd: { type: number, minimum: 0 }
        biaya_ingestion_usd: { type: number, minimum: 0 }
        biaya_usd: { type: number, minimum: 0 }

    Costs:
      type: object
      required: [sejak, sampai, jumlah_panggilan_llm, input_tokens, output_tokens, total_tokens, biaya_usd, biaya_llm_usd, embed_chat_tokens, biaya_embed_chat_usd, jumlah_embed_chat, usage_log_tokens, biaya_usage_log_usd, jumlah_usage_log, llm_tanpa_biaya, embed_chat_tanpa_biaya, usage_log_tanpa_biaya, rincian_model, biaya_harian]
      properties:
        sejak: { type: string, format: date }
        sampai: { type: string, format: date }
        jumlah_panggilan_llm: { type: integer, minimum: 0 }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        total_tokens: { type: integer, minimum: 0 }
        biaya_usd: { type: number, minimum: 0 }
        biaya_llm_usd: { type: number, minimum: 0 }
        embed_chat_tokens: { type: integer, minimum: 0 }
        biaya_embed_chat_usd: { type: number, minimum: 0 }
        jumlah_embed_chat: { type: integer, minimum: 0 }
        usage_log_tokens: { type: integer, minimum: 0 }
        biaya_usage_log_usd: { type: number, minimum: 0 }
        jumlah_usage_log: { type: integer, minimum: 0 }
        llm_tanpa_biaya: { type: integer, minimum: 0 }
        embed_chat_tanpa_biaya: { type: integer, minimum: 0 }
        usage_log_tanpa_biaya: { type: integer, minimum: 0 }
        rincian_model:
          type: array
          items: { $ref: '#/components/schemas/CostByModel' }
        biaya_harian:
          type: array
          items: { $ref: '#/components/schemas/DailyCost' }

    KillSwitchRequest:
      type: object
      required: [engaged]
      properties:
        engaged: { type: boolean }
        alasan:
          type: [string, 'null']
          maxLength: 500
          description: Wajib diisi (bukan spasi saja) saat `engaged` true. Diabaikan saat false.

    KillSwitchState:
      type: object
      required: [engaged]
      properties:
        engaged: { type: boolean }
        reason: { type: [string, 'null'] }
        engaged_at: { type: [string, 'null'], format: date-time }
        engaged_by:
          type: [string, 'null']
          description: |
            Email admin yang menyalakan, atau `konfigurasi server` bila
            dinyalakan lewat `KILL_SWITCH_ENABLED`.

    # --- Konfigurasi runtime ------------------------------------------------
    RuntimeConfigValues:
      type: object
      required:
        [retrieval_candidates, retrieval_top_n, rrf_k, rrf_weight_vector,
         rrf_weight_fulltext, vector_threshold, lexical_threshold, chunk_size,
         chunk_overlap]
      description: |
        Parameter yang dapat disetel dari dashboard. Namanya sengaja sama persis
        dengan variabel di `.env` dan field `app.config.Settings`.
      properties:
        retrieval_candidates:
          type: integer
          description: Kandidat per sumber sebelum fusi (FR-2).
        retrieval_top_n:
          type: integer
          description: Potongan yang masuk konteks LLM setelah RRF.
        rrf_k:
          type: integer
          description: Konstanta peredam RRF; makin besar, makin rata pengaruh peringkat.
        rrf_weight_vector:
          type: number
          description: Bobot pencarian vektor saat fusi. 0 mematikan sumber ini.
        rrf_weight_fulltext:
          type: number
          description: Bobot pencarian kata saat fusi. 0 mematikan sumber ini.
        vector_threshold:
          type: number
          description: Kemiripan vektor minimum sebelum LLM dipanggil (FR-3).
        lexical_threshold:
          type: number
          description: Skor `ts_rank` minimum sebelum LLM dipanggil (FR-3).
        chunk_size:
          type: integer
          description: Pagar atas panjang satu potongan, dalam token (FR-1).
        chunk_overlap:
          type: integer
          description: Tumpang tindih antar potongan saat satu bagian harus dipecah.

    RuntimeConfigUpdate:
      type: object
      additionalProperties: false
      description: |
        Hanya field yang dikirim yang diubah; `null` mengembalikan field itu ke
        nilai `.env`. Batas di sini adalah pagar kewarasan; aturan antar-field
        diperiksa terhadap hasil gabungannya.
      properties:
        retrieval_candidates: { type: [integer, 'null'], minimum: 1, maximum: 100 }
        retrieval_top_n: { type: [integer, 'null'], minimum: 1, maximum: 50 }
        rrf_k: { type: [integer, 'null'], minimum: 1, maximum: 1000 }
        rrf_weight_vector: { type: [number, 'null'], minimum: 0, maximum: 5 }
        rrf_weight_fulltext: { type: [number, 'null'], minimum: 0, maximum: 5 }
        vector_threshold: { type: [number, 'null'], minimum: 0, maximum: 1 }
        lexical_threshold: { type: [number, 'null'], minimum: 0, maximum: 1 }
        chunk_size: { type: [integer, 'null'], minimum: 200, maximum: 4000 }
        chunk_overlap: { type: [integer, 'null'], minimum: 0, maximum: 1000 }

    RuntimeConfig:
      type: object
      required: [nilai, nilai_env, diubah, chat_model, embed_model, api_key_terisi]
      properties:
        nilai:
          allOf: [{ $ref: '#/components/schemas/RuntimeConfigValues' }]
          description: Yang dipakai layanan saat ini.
        nilai_env:
          allOf: [{ $ref: '#/components/schemas/RuntimeConfigValues' }]
          description: Yang tertulis di `.env` server.
        diubah:
          type: array
          items: { type: string }
          description: Nama parameter yang sedang ditimpa dari dashboard.
        chat_model: { type: string }
        embed_model: { type: string }
        base_url:
          type: [string, 'null']
          description: Endpoint OpenAI-compatible; kosong berarti OpenAI resmi.
        api_key_terisi:
          type: boolean
          description: Kuncinya sendiri tidak pernah dikirim ke peramban.
        diperbarui_at: { type: [string, 'null'], format: date-time }
        diperbarui_oleh: { type: [string, 'null'] }
        peringatan:
          type: [string, 'null']
          description: |
            Terisi bila nilai tersimpan tidak dapat dipakai (mis. `.env` berubah
            sehingga kombinasinya melanggar aturan) dan layanan sementara
            kembali ke `.env`.

    # --- Akun dan level akses ----------------------------------------------
    AdminRole:
      type: string
      enum: [staf, admin, superadmin]
      description: |
        Level bertingkat; setiap level mencakup hak level di bawahnya. `staf`
        ditampilkan sebagai "Staf/Dosen".

    AdminUser:
      type: object
      required: [id, email, role, is_active]
      description: Akun dashboard. Hash kata sandi tidak pernah dikirim.
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/AdminRole' }
        is_active: { type: boolean }
        nama: { type: [string, 'null'] }
        unit:
          type: [string, 'null']
          description: |
            Wajib untuk `staf`: membatasi dokumen yang dapat dikelola. Untuk level
            lain hanya keterangan.
        created_at: { type: [string, 'null'], format: date-time }
        last_login_at: { type: [string, 'null'], format: date-time }

    AdminUserCreate:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/AdminRole' }
        nama: { type: [string, 'null'], maxLength: 200 }
        unit:
          type: [string, 'null']
          maxLength: 200
          description: Wajib bila `role` bernilai `staf`.

    AdminUserUpdate:
      type: object
      description: Hanya field yang dikirim yang diubah. Field tak dikenal ditolak.
      properties:
        nama: { type: [string, 'null'], maxLength: 200 }
        role: { $ref: '#/components/schemas/AdminRole' }
        unit: { type: [string, 'null'], maxLength: 200 }
        is_active: { type: boolean }

    AdminUserCreated:
      type: object
      required: [user, password_sementara]
      properties:
        user: { $ref: '#/components/schemas/AdminUser' }
        password_sementara:
          type: string
          description: Ditampilkan SEKALI dan tidak dapat diambil lagi.

    TemporaryPassword:
      type: object
      required: [password_sementara]
      properties:
        password_sementara: { type: string }

    PasswordChange:
      type: object
      required: [password_lama, password_baru]
      properties:
        password_lama: { type: string, minLength: 1, maxLength: 256 }
        password_baru:
          type: string
          minLength: 12
          maxLength: 72
          description: Maksimal 72 byte (batas bcrypt).

    # --- Galat -------------------------------------------------------------
    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: |
            Kalimat siap tampil. Untuk endpoint admin bahasanya non-teknis
            (PRD §9: "dokumen sedang diproses", bukan "embedding in progress").

    ValidationError:
      type: object
      required: [loc, msg, type]
      properties:
        loc:
          type: array
          items:
            type: [string, integer]
        msg: { type: string }
        type: { type: string }

    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items: { $ref: '#/components/schemas/ValidationError' }
