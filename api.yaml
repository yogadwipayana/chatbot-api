openapi: 3.1.0

# =============================================================================
# Kontrak API Chatbot Administrasi Mahasiswa
#
# Berkas ini adalah kontrak yang disepakati backend dan frontend, mencakup
# SELURUH permukaan API pada PRD v2.0 -- termasuk endpoint yang belum
# diimplementasikan, supaya pekerjaan frontend (client/ dan admin/) tidak perlu
# menunggu backend selesai.
#
# Setiap operasi diberi penanda `x-status`:
#   implemented : sudah ada di app/routers/, diuji di tests/api/
#   planned     : kontrak sudah disepakati, kode belum ditulis
#
# Setiap operasi admin juga diberi `x-min-role` (staf | admin | superadmin):
# level akun minimum. `tests/api/test_admin_roles.py` membangkitkan satu kasus
# untuk setiap level di bawah minimum dan memastikan server menjawab 403.
#
# `tests/api/test_openapi_contract.py` membandingkan berkas ini dengan spesifikasi
# yang dihasilkan FastAPI. Operasi `implemented` yang menyimpang akan menggagalkan
# test -- jadi kontrak ini tidak bisa diam-diam basi.
#
# Kalau ada perbedaan antara berkas ini dan kode untuk endpoint `implemented`,
# KODE yang benar. Perbarui berkas ini, jangan sebaliknya.
# =============================================================================

info:
  title: Chatbot Administrasi Mahasiswa
  version: 0.1.0
  description: |
    API chatbot RAG untuk pertanyaan administrasi akademik mahasiswa.

    ## Empat jenis balasan

    Endpoint chat selalu mengembalikan 200 dengan `kind` yang menentukan cara
    frontend menampilkannya. `answer`, `refusal`, dan `support` WAJIB terlihat
    berbeda satu sama lain:

    | `kind` | Arti | Tampilan |
    |---|---|---|
    | `answer` | Jawaban bersumber dokumen resmi | Bubble normal + kartu sitasi (FE-2) |
    | `refusal` | Retrieval terlalu lemah, LLM tidak dipanggil (FR-3) | Visual berbeda + kontak (FE-4) |
    | `support` | Pertanyaan bernuansa tekanan mental (FR-7) | Nada empatik + kontak konseling |
    | `smalltalk` | Sapaan atau basa-basi; retrieval dan LLM dilewati | Bubble biasa, tanpa sitasi dan tanpa tombol umpan balik |

    Hanya `answer` yang membawa sitasi. Menampilkan kartu sitasi di layar
    penolakan memberi kesan keliru bahwa jawabannya bersumber; menampilkannya
    pada sapaan sama saja mengklaim "halo" ada di panduan akademik.

    `smalltalk` ada supaya mahasiswa yang mengetik "hai" tidak dibalas
    penolakan berisi alamat loket biro, dan supaya sapaan tidak masuk daftar
    pertanyaan tak terjawab (AD-4).

    ## Sitasi dan verifikasi (FE-2)

    PRD §8 menyebut FE-2 sebagai komponen paling kritis: verifikasi harus
    semudah satu klik, kalau tidak mahasiswa akan percaya buta. Setiap objek
    `Citation` membawa `document_id` dan `halaman` yang cukup untuk membuka PDF
    tepat di halaman tersebut lewat `GET /api/documents/{document_id}/file`.

    ## Privasi

    Tidak ada login mahasiswa dan tidak ada identitas yang disimpan (PRD §11).
    `session_id` dibangkitkan di sisi klien dan disimpan di localStorage; ia
    hanya untuk merangkai percakapan dan membatasi laju, bukan untuk mengenali
    orang. Jangan pernah mengisinya dengan NIM atau email.

    ## Level akses dashboard admin

    Tiga level bertingkat; setiap level mencakup hak level di bawahnya.
    Level minimum tiap operasi tercatat sebagai `x-min-role`.

    | Level | Hak |
    |---|---|
    | `staf` (Staf/Dosen) | Kelola dokumen dan entri tanya jawab **unitnya sendiri**, uji coba jawaban, lihat pertanyaan tak terjawab |
    | `admin` | + kelola dokumen dan tanya jawab semua unit, tandai pertanyaan selesai, statistik |
    | `superadmin` | + kill switch layanan chat, kelola akun dashboard |

    Level dan unit dibaca dari database pada setiap permintaan, bukan dari isi
    token: perubahan level, pemindahan unit, dan penonaktifan akun berlaku saat
    itu juga. Token yang terbit sebelum kata sandi terakhir diganti ditolak.
  contact:
    name: Biro Administrasi Akademik
    email: akademik@kampus.ac.id
  license:
    name: Internal kampus

servers:
  - url: http://localhost:8000
    description: Pengembangan lokal
  - url: https://chatbot.kampus.ac.id
    description: Produksi (di balik Caddy)

tags:
  - name: chat
    description: Endpoint mahasiswa. Tanpa login, dibatasi laju, tunduk pada kill switch.
  - name: dokumen
    description: Akses berkas PDF sumber, untuk verifikasi sitasi (FE-2).
  - name: sistem
    description: Health check dan status layanan.
  - name: admin-auth
    description: Autentikasi dashboard admin (AD-1).
  - name: admin-dokumen
    description: Kelola dokumen sumber (AD-2, AD-3).
  - name: admin-tanya-jawab
    description: Entri tanya jawab, sumber jawaban yang diketik langsung tanpa PDF.
  - name: admin-kualitas
    description: Pertanyaan tak terjawab dan uji coba retrieval (AD-4, AD-6).
  - name: admin-operasional
    description: Statistik dan kill switch (AD-5, FR-9).
  - name: admin-pengguna
    description: Kelola akun dashboard dan level aksesnya (khusus superadmin).

paths:
  # ===========================================================================
  # MAHASISWA
  # ===========================================================================
  /api/chat:
    post:
      tags: [chat]
      summary: Ajukan pertanyaan, terima jawaban lengkap
      operationId: chat
      x-status: implemented
      description: |
        Balasan sekali kirim. Dipakai kotak uji coba admin (AD-6) dan test.
        Untuk antarmuka mahasiswa gunakan `/api/chat/stream` agar token muncul
        bertahap (FE-1).

        Alurnya (PRD §7): sanitasi input -> pemeriksaan sensitif (FR-7) ->
        penulisan ulang query (FR-4) -> retrieval hibrida (FR-2) -> ambang
        penolakan (FR-3) -> deteksi topik berisiko (FR-6) -> generasi (FR-5).

        LLM tidak dipanggil sama sekali bila `kind` bernilai `refusal` atau
        `support`.
      parameters:
        - $ref: '#/components/parameters/SessionIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
            examples:
              pertanyaan_pertama:
                summary: Pesan pertama, tanpa riwayat
                value:
                  question: Kapan pengisian KRS semester ganjil dibuka?
                  session_id: 5f2c9a1b-7e04-4d3a-9c88-1a2b3c4d5e6f
              pertanyaan_lanjutan:
                summary: Pertanyaan lanjutan, memicu penulisan ulang query (FR-4)
                value:
                  question: Kalau telat gimana?
                  session_id: 5f2c9a1b-7e04-4d3a-9c88-1a2b3c4d5e6f
                  history:
                    - role: user
                      konten: Kapan pengisian KRS dibuka?
                    - role: assistant
                      konten: Pengisian KRS dibuka 1-7 Agustus 2025.
      responses:
        '200':
          description: |
            Selalu 200 selama pertanyaannya sah, termasuk saat sistem menolak
            menjawab. Penolakan adalah hasil yang sah, bukan kegagalan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
              examples:
                jawaban:
                  $ref: '#/components/examples/JawabanNormal'
                penolakan:
                  $ref: '#/components/examples/Penolakan'
                eskalasi:
                  $ref: '#/components/examples/JawabanEskalasi'
                dukungan:
                  $ref: '#/components/examples/Dukungan'
                sapaan:
                  $ref: '#/components/examples/Sapaan'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/KillSwitchAktif'

  /api/chat/stream:
    post:
      tags: [chat]
      summary: Ajukan pertanyaan, terima jawaban sebagai Server-Sent Events
      operationId: chat_stream
      x-status: implemented
      description: |
        Sama dengan `/api/chat`, tetapi jawabannya dialirkan sebagai SSE (FE-1).

        Urutan event:

        | Event | Kapan | Data |
        |---|---|---|
        | `status` | Segera, sebelum retrieval | `{"stage": "mencari dokumen"}` |
        | `status` | Setelah retrieval, sebelum token pertama | `{"stage": "menyusun jawaban"}` |
        | `token` | Berkali-kali, selagi LLM menulis | `{"text": "<potongan jawaban>"}` |
        | `message` | Setelah pipeline selesai | Objek `ChatResponse` utuh |
        | `done` | Terakhir | `{}` |

        Event `status` yang mengisi indikator "mencari dokumen..." di FE-1.
        Tahap kedua menyusul begitu dokumen didapat, supaya indikatornya tidak
        tertinggal di kalimat yang sudah tidak benar selama LLM menyusun
        jawaban.

        `token` membawa potongan mentah jawaban, bukan jawaban yang bertambah
        panjang: klien merangkainya sendiri. Potongan hanya untuk ditampilkan
        selagi berjalan -- teks final yang sah adalah `text` pada `message`,
        yang juga satu-satunya sumber sitasi dan `message_id`. Jalur yang tidak
        memanggil LLM (penolakan FR-3, pertanyaan sensitif FR-7, sapaan) tidak
        mengirim `token` sama sekali dan langsung sampai ke `message`.

        Klien harus menangani putusnya koneksi di tengah jalan: bila `done`
        tidak pernah tiba, perlakukan jawaban sebagai tidak lengkap dan jangan
        tampilkan sitasinya.
      parameters:
        - $ref: '#/components/parameters/SessionIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Aliran SSE
          headers:
            Cache-Control:
              schema: { type: string, const: no-cache }
            X-Accel-Buffering:
              description: Mencegah reverse proxy menahan aliran sampai selesai.
              schema: { type: string, const: 'no' }
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: status
                data: {"stage": "mencari dokumen"}

                event: status
                data: {"stage": "menyusun jawaban"}

                event: token
                data: {"text": "Pengisian KRS dibuka"}

                event: token
                data: {"text": " 1-7 Agustus 2025"}

                event: message
                data: {"kind": "answer", "text": "Pengisian KRS dibuka 1-7 Agustus 2025 [Panduan Akademik 2025, hal. 12].", "citations": [{"judul": "Panduan Akademik 2025", "halaman": 12, "document_id": "3f1a...", "file_path": "storage/documents/3f1a....pdf"}], "contacts": [], "escalated": false, "top_score": 0.82}

                event: done
                data: {}
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/KillSwitchAktif'

  /api/feedback:
    post:
      tags: [chat]
      summary: Kirim umpan balik atas satu jawaban
      operationId: submit_feedback
      x-status: implemented
      description: |
        FE-5: satu klik, tanpa modal. `catatan` opsional dan hanya muncul bila
        mahasiswa memilih mengisinya.

        Mengirim ulang untuk `message_id` yang sama MENGGANTI umpan balik
        sebelumnya, supaya mahasiswa yang berubah pikiran dari 👍 ke 👎 tidak
        terhitung dua kali.

        Rasio umpan balik positif adalah metrik PRD §3 (target >= 75%).
        Perhatikan anti-metriknya: volume percakapan tinggi bisa berarti sistem
        berguna, bisa juga berarti jawabannya buruk sehingga mahasiswa bertanya
        berulang kali.
      parameters:
        - $ref: '#/components/parameters/SessionIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '204':
          description: Tercatat. Tidak ada isi balasan -- FE-5 tidak menampilkan konfirmasi.
        '404':
          $ref: '#/components/responses/TidakDitemukan'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/suggestions:
    get:
      tags: [chat]
      summary: Saran pertanyaan untuk layar awal
      operationId: list_suggestions
      x-status: planned
      description: |
        FE-6: 4-5 contoh pertanyaan, ditampilkan sebelum mahasiswa mengetik.

        Isinya WAJIB berasal dari hasil survei (PRD §15 butir 1), bukan karangan
        pengembang. Menampilkan pertanyaan yang tidak pernah benar-benar
        ditanyakan orang akan mengarahkan mahasiswa ke jalur yang salah sejak
        layar pertama.
      responses:
        '200':
          description: Daftar saran
          content:
            application/json:
              schema:
                type: array
                maxItems: 5
                items:
                  $ref: '#/components/schemas/Suggestion'
              example:
                - teks: Kapan pengisian KRS dibuka?
                - teks: Bagaimana cara mengajukan cuti kuliah?
                - teks: Apa saja syarat wisuda?
                - teks: Bagaimana cara minta surat keterangan aktif kuliah?

  /api/documents/{document_id}/file:
    get:
      tags: [dokumen]
      summary: Unduh atau tampilkan PDF sumber
      operationId: get_document_file
      x-status: implemented
      description: |
        Tujuan klik pada kartu sitasi (FE-2). Nomor halaman TIDAK dikirim ke
        server -- klien membukanya lewat fragment PDF viewer
        (`.../file#page=12`) atau meneruskannya ke react-pdf.

        Hanya dokumen `is_active = true` yang dilayani. Dokumen yang sudah
        dinonaktifkan mengembalikan 404, supaya tautan lama pada percakapan
        lampau tidak diam-diam menyajikan informasi kedaluwarsa.

        **Balasannya bergantung pada `STORAGE_BACKEND`, jadi klien harus siap
        menerima keduanya:**

        | Backend | Balasan |
        |---|---|
        | `s3` (S3 / R2) | `307` ke presigned URL atau URL publik bucket |
        | `local` | `200` dengan isi PDF langsung |

        Pengalihan dipilih untuk S3 supaya PDF mengalir dari object storage ke
        peramban tanpa melewati proses API. Panduan akademik bisa puluhan
        megabita; menyalurkannya lewat API hanya menghabiskan memori dan
        koneksi tanpa manfaat apa pun.

        Setel `fetch(..., { redirect: 'follow' })` atau cukup pasang URL ini
        sebagai `src` — peramban mengikuti pengalihan dengan sendirinya. Jangan
        cache URL hasil pengalihan: presigned URL kedaluwarsa (default 15
        menit) dan harus diminta ulang lewat endpoint ini.
      parameters:
        - name: document_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Berkas PDF (hanya saat `STORAGE_BACKEND=local`)
          headers:
            Content-Disposition:
              description: '`inline` agar terbuka di viewer, bukan terunduh.'
              schema: { type: string }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '307':
          description: |
            Pengalihan ke object storage (saat `STORAGE_BACKEND=s3`).
          headers:
            Location:
              description: Presigned URL berumur pendek, atau URL publik bucket.
              schema: { type: string, format: uri }
        '404':
          $ref: '#/components/responses/TidakDitemukan'

  # ===========================================================================
  # SISTEM
  # ===========================================================================
  /health:
    get:
      tags: [sistem]
      summary: Health check
      operationId: health
      x-status: implemented
      description: |
        Dipakai Uptime Kuma (PRD §10).

        Tetap 200 saat kill switch aktif. Kill switch adalah keputusan operator,
        bukan kegagalan sistem; melaporkannya sebagai unhealthy akan membuat
        monitoring membanjiri alert justru ketika insiden sedang ditangani.
        Pantau `chat_enabled` bila ingin tahu layanan chat hidup atau tidak.
      responses:
        '200':
          description: Proses hidup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  # ===========================================================================
  # ADMIN
  # ===========================================================================
  /api/admin/login:
    post:
      tags: [admin-auth]
      summary: Login admin
      operationId: admin_login
      x-status: implemented
      description: |
        AD-1. Mengembalikan JWT berumur `ADMIN_TOKEN_TTL_MINUTES` (default 8 jam).

        Balasan gagal sengaja tidak membedakan "email tidak terdaftar" dari
        "kata sandi salah", supaya tidak bisa dipakai memetakan siapa saja yang
        punya akun admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '403':
          description: |
            Kata sandi benar, tetapi akun sudah dinonaktifkan superadmin. Hanya
            diberitahukan setelah kata sandi terbukti benar, jadi status akun tidak
            bocor ke orang yang sekadar menebak email.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Email atau kata sandi salah
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { detail: Email atau kata sandi salah }
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/admin/documents:
    get:
      tags: [admin-dokumen]
      summary: Daftar dokumen
      operationId: list_documents
      x-status: implemented
      x-min-role: staf
      security: [{ bearerAuth: [] }]
      description: |
        AD-2. Setiap baris membawa `stale` untuk badge peringatan: dokumen yang
        lebih dari 6 bulan tidak diperbarui, atau sudah lewat `valid_until`.

        PRD §12 menyebut "dokumen tidak diupdate" sebagai risiko dengan dampak
        sistem menyebarkan info kedaluwarsa secara aktif. Badge ini mitigasinya,
        jadi jangan sembunyikan di balik filter.

        Staf/dosen hanya melihat dokumen unitnya; `total` dan `jumlah_stale` pun
        dihitung atas unit itu. Membuka, mengubah, menghapus, atau mengunggah
        dokumen unit lain dijawab 403. Nama unit dibandingkan tanpa peduli huruf
        besar dan spasi berlebih.
      parameters:
        - name: include_inactive
          in: query
          schema: { type: boolean, default: false }
        - name: only_stale
          in: query
          description: Saring hanya dokumen yang perlu ditinjau.
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Daftar dokumen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPage'
        '401':
          $ref: '#/components/responses/TidakBerwenang'
        '403':
          $ref: '#/components/responses/Terlarang'

    post:
      tags: [admin-dokumen]
      summary: Unggah dokumen baru
      operationId: upload_document
      x-status: implemented
      x-min-role: staf
      security: [{ bearerAuth: [] }]
      description: |
        AD-3. Drag & drop + form metadata. Pemrosesan berjalan sinkron: unggah,
        ekstraksi, chunking, embedding, simpan -- semuanya dalam satu transaksi.
        Dokumen yang gagal di tengah jalan tidak meninggalkan chunk yatim.

        PDF hasil scan tanpa lapisan teks ditolak dengan 422 (FR-1). Ini bukan
        kerewelan: chunk kosong tetap masuk indeks dan tidak pernah terambil,
        sehingga dokumen tampak terpasang padahal tidak berfungsi.

        Bahasa pesan galat ke admin harus non-teknis (PRD §9).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentUpload'
            encoding:
              file:
                contentType: application/pdf
      responses:
        '201':
          description: Dokumen terpasang dan terindeks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionResult'
        '401':
          $ref: '#/components/responses/TidakBerwenang'
        '403':
          $ref: '#/components/responses/Terlarang'
        '502':
          description: |
            Layanan luar gagal: penyimpanan dokumen atau API AI. `detail` berisi
            kalimat siap tampil yang menyarankan mencoba lagi; rinciannya hanya
            ada di log server.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: Berkas melebihi `MAX_UPLOAD_MB`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: |
            Berkas ditolak. `detail` sudah berupa kalimat siap tampil untuk admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                pdf_scan:
                  summary: PDF hasil scan (FR-1)
                  value:
                    detail: >-
                      'Panduan Akademik 2025.pdf' tampaknya hasil scan tanpa lapisan
                      teks (85% halaman kosong). Jalankan OCR terlebih dahulu, atau
                      unggah versi digital aslinya.
                kosong:
                  summary: Tidak menghasilkan satu chunk pun
                  value:
                    detail: "'Lampiran.pdf' tidak menghasilkan satu chunk pun"

  /api/admin/documents/{document_id}:
    parameters:
      - name: document_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [admin-dokumen]
      summary: Detail satu dokumen
      operationId: get_document
      x-status: implemented
      x-min-role: staf
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Detail dokumen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '401': { $ref: '#/components/responses/TidakBerwenang' }
        '403': { $ref: '#/components/responses/Terlarang' }
        '404': { $ref: '#/components/responses/TidakDitemukan' }

    patch:
      tags: [admin-dokumen]
      summary: Perbarui metadata atau status aktif
      operationId: update_document
      x-status: implemented
      x-min-role: staf
      security: [{ bearerAuth: [] }]
      description: |
        Mengubah `valid_until` atau `is_active` langsung mempengaruhi retrieval
        pada permintaan berikutnya -- filter dokumen aktif dievaluasi di dalam
        WHERE setiap query (FR-2), bukan di-cache.

        Menonaktifkan dokumen TIDAK menghapus chunk-nya, sehingga dapat
        dikembalikan bila ternyata keliru.

        `updated_at` diperbarui saat `judul`, `unit`, `tahun_berlaku`, atau
        `valid_until` berubah -- itu dianggap peninjauan dan menghapus badge
        usia AD-2. Mengubah `is_active` saja tidak: menyalakan ulang dokumen
        lama tidak boleh menghapus peringatannya.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentUpdate' }
      responses:
        '200':
          description: Tersimpan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '401': { $ref: '#/components/responses/TidakBerwenang' }
        '403': { $ref: '#/components/responses/Terlarang' }
