        '401': { $ref: '#/components/responses/TidakBerwenang' }
        '403': { $ref: '#/components/responses/Terlarang' }
        '404': { $ref: '#/components/responses/TidakDitemukan' }

  /api/admin/faq:
    get:
      tags: [admin-tanya-jawab]
      summary: Daftar entri tanya jawab
      operationId: list_faq
      x-status: implemented
      x-min-role: staf
      security: [{ bearerAuth: [] }]
      description: |
        Entri tanya jawab adalah satu pasang pertanyaan dan jawaban yang diketik
        admin langsung di dashboard, tanpa berkas PDF sama sekali.

        Chatbot memperlakukannya persis seperti dokumen: ikut terambil retrieval
        hibrida, ikut berhenti dipakai saat `valid_until` lewat (FR-2), dan ikut
        menjadi kartu sitasi -- dengan `jenis: tanya_jawab`, sehingga frontend
        tahu tidak ada berkas yang bisa dibuka.

        Inilah jalan tercepat menutup pertanyaan tak terjawab (AD-4): tidak
        semua jawaban perlu menunggu dokumen resmi terbit lebih dulu.

        Staf/dosen hanya melihat entri unitnya, sama seperti dokumen, dan
        `total` pun dihitung atas unit itu.
      parameters:
        - name: include_inactive
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Daftar entri tanya jawab
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaqPage' }
        '401': { $ref: '#/components/responses/TidakBerwenang' }
        '403': { $ref: '#/components/responses/Terlarang' }

    post:
      tags: [admin-tanya-jawab]
      summary: Tambah entri tanya jawab
      operationId: create_faq
      x-status: implemented
      x-min-role: staf
      security: [{ bearerAuth: [] }]
      description: |
        Sinkron seperti unggah dokumen: entri disimpan, dipecah menjadi chunk,
        dan di-embed dalam satu transaksi. Begitu balasan 201 diterima, chatbot
        sudah dapat memakainya pada pertanyaan berikutnya.

        Tulis pertanyaannya seperti mahasiswa akan menanyakannya -- kalimat itu
        ikut diindeks dan ikut tampil sebagai judul sumber pada kartu sitasi.

        Jawaban panjang dipecah menjadi beberapa chunk, dan setiap potongannya
        tetap membawa pertanyaannya.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FaqEntryCreate' }
      responses:
        '201':
          description: Entri tersimpan dan terindeks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaqEntry' }
        '401': { $ref: '#/components/responses/TidakBerwenang' }
        '403': { $ref: '#/components/responses/Terlarang' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '502':
          description: |
            Layanan AI untuk menghitung embedding gagal. `detail` berisi kalimat
            siap tampil yang menyarankan mencoba lagi; entri tidak tersimpan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/admin/faq/{entry_id}:
    parameters:
      - name: entry_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [admin-tanya-jawab]
      summary: Perbarui entri tanya jawab
      operationId: update_faq
      x-status: implemented
      x-min-role: staf
      security: [{ bearerAuth: [] }]
      description: |
        Mengubah `pertanyaan` atau `jawaban` membuang chunk lama dan menghitung
        ulang embedding-nya dalam transaksi yang sama. Indeks yang masih memuat
        kalimat versi lama akan menjawab mahasiswa dengan aturan yang sudah
        dicabut -- persis risiko yang diangkat PRD §12.

        `updated_at` diperbarui saat isi berubah (`pertanyaan`, `jawaban`,
        `unit`, `valid_until`), tetapi tidak saat hanya `is_active` yang
        berubah -- sama seperti dokumen.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FaqEntryUpdate' }
      responses:
        '200':
          description: Tersimpan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaqEntry' }
        '401': { $ref: '#/components/responses/TidakBerwenang' }
        '403': { $ref: '#/components/responses/Terlarang' }
        '404': { $ref: '#/components/responses/TidakDitemukan' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '502':
          description: Layanan AI gagal saat mengindeks ulang; entri tidak berubah.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

    delete:
      tags: [admin-tanya-jawab]
      summary: Hapus entri tanya jawab
      operationId: delete_faq
      x-status: implemented
      x-min-role: staf
      security: [{ bearerAuth: [] }]
      description: |
        Permanen dan tidak dapat dibatalkan; frontend WAJIB meminta konfirmasi
        (PRD §9). Untuk sekadar menghentikan pemakaiannya, pakai
        `PATCH { "is_active": false }`.
      responses:
        '204':
          description: Terhapus
        '401': { $ref: '#/components/responses/TidakBerwenang' }
        '403': { $ref: '#/components/responses/Terlarang' }
        '404': { $ref: '#/components/responses/TidakDitemukan' }

  /api/admin/unanswered:
    get:
      tags: [admin-kualitas]
      summary: Pertanyaan tak terjawab, dikelompokkan
      operationId: list_unanswered
      x-status: implemented
      x-min-role: staf
      security: [{ bearerAuth: [] }]
      description: |
        AD-4. PRD menyebut halaman ini "menentukan sistem membaik atau stagnan"
        dan meminta ia ditempatkan menonjol di navigasi.

        Pertanyaan yang mirip dikelompokkan beserta frekuensinya, sehingga admin
        melihat "12 mahasiswa menanyakan ini" alih-alih 12 baris terpisah.

        Kemiripan diukur dari kata yang sama setelah kata tanya dan sapaan
        dibuang (bukan embedding), jadi dapat dijelaskan dan tidak memanggil API
        berbayar. Pertanyaan yang sudah dan belum ditindaklanjuti tidak pernah
        berada di kelompok yang sama. `limit` dan `offset` berlaku atas
        kelompok, bukan atas baris.
      parameters:
        - name: resolved
          in: query
          description: Kosongkan untuk menampilkan keduanya.
          schema: { type: boolean }
        - name: sejak
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Kelompok pertanyaan
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UnansweredGroup' }
              example:
                - ids:
                    - 0b6f2c1e-3a4d-4e5f-9a8b-7c6d5e4f3a2b
                    - 1c7a3d2f-4b5e-4f60-8b9c-8d7e6f5a4b3c
                  contoh_pertanyaan: Bagaimana cara mengurus surat keterangan lulus?
                  jumlah: 12
                  top_score_rata2: 0.21
                  terakhir_ditanyakan: '2026-09-09T14:22:11Z'
                  resolved: false
        '401': { $ref: '#/components/responses/TidakBerwenang' }
        '403': { $ref: '#/components/responses/Terlarang' }

  /api/admin/unanswered/{unanswered_id}:
